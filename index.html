<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1226">
<title>STATMASTER – Statistical Inference II</title>
<style>
/* ================= THEME ================= */
:root{--bg:#0a1226;--bg2:#0e1a38;--surf:#13244b;--surf2:#192e5c;--line:rgba(120,160,255,.16);--txt:#f4f7ff;--mut:#9fb0d6;--blue:#2f7bff;--cyan:#22d3ee;--ok:#34d399;--bad:#f87171;--warn:#fbbf24;--r:16px}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--txt);background:radial-gradient(900px 500px at 85% -10%,rgba(47,123,255,.22),transparent 60%),radial-gradient(700px 400px at -10% 10%,rgba(34,211,238,.12),transparent 60%),var(--bg);min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
svg.i{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* header */
header{position:sticky;top:0;z-index:10;background:rgba(10,18,38,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.bar{max-width:980px;margin:auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.12em;font-size:1.05rem}
.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--blue),var(--cyan));box-shadow:0 4px 16px rgba(47,123,255,.45)}
nav{display:flex;gap:4px}
nav button{padding:8px 12px;border-radius:10px;color:var(--mut);display:flex;gap:6px;align-items:center;font-size:.9rem;font-weight:600}
nav button.on{background:var(--surf);color:var(--txt)}
main{max-width:980px;margin:auto;padding:18px 16px 48px}
h1{font-size:1.6rem;line-height:1.25}h2{font-size:1.2rem;margin:26px 0 12px}
.mut{color:var(--mut)}.sm{font-size:.85rem}
/* cards & buttons */
.card{background:linear-gradient(160deg,var(--surf),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.28)}
.hero{background:linear-gradient(135deg,#1b3d8f,#12306e 55%,#0e5a7a);position:relative;overflow:hidden}
.hero p{color:#cfe0ff;margin:6px 0 16px}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;background:rgba(34,211,238,.15);color:var(--cyan);font-size:.78rem;font-weight:700;margin-bottom:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:12px;font-weight:700;background:linear-gradient(135deg,var(--blue),var(--cyan));color:#04122e;min-height:46px;box-shadow:0 6px 18px rgba(47,123,255,.4)}
.btn.ghost{background:var(--surf2);color:var(--txt);box-shadow:none;border:1px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(2,1fr)}
.stat b{display:block;font-size:1.7rem}.stat span{color:var(--mut);font-size:.82rem}
.prog{height:8px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:9px;transition:width .3s}
.qcard{display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
.qcard.lock{opacity:.6}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.badge{font-size:.74rem;font-weight:700;padding:3px 10px;border-radius:99px}
.b-ok{background:rgba(52,211,153,.15);color:var(--ok)}.b-av{background:rgba(47,123,255,.2);color:#8db4ff}.b-lk{background:rgba(255,255,255,.08);color:var(--mut)}
/* quiz */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:thin}
.chip{min-width:38px;height:38px;border-radius:10px;background:var(--surf);border:1px solid var(--line);font-weight:700;font-size:.9rem}
.chip.done{background:rgba(47,123,255,.3);border-color:var(--blue)}.chip.cur{outline:2px solid var(--cyan)}
.qtext{font-size:1.1rem;font-weight:600;margin:6px 0 16px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:13px 14px;margin-bottom:10px;border-radius:12px;background:var(--bg2);border:1.5px solid var(--line)}
.opt .k{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--surf2);font-weight:800;font-size:.9rem}
.opt.sel{border-color:var(--cyan);background:rgba(34,211,238,.1)}.opt.sel .k{background:var(--cyan);color:#04122e}
.opt.right{border-color:var(--ok);background:rgba(52,211,153,.1)}.opt.right .k{background:var(--ok);color:#04122e}
.opt.wrong{border-color:var(--bad);background:rgba(248,113,113,.1)}.opt.wrong .k{background:var(--bad);color:#04122e}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:14px}.nav .btn{flex:1}
.score{text-align:center}.score .big{font-size:3.2rem;font-weight:800;background:linear-gradient(135deg,var(--blue),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.actions .btn{flex:1;min-width:140px}
.rev{margin-top:14px}.rev.ok{border-left:4px solid var(--ok)}.rev.bad{border-left:4px solid var(--bad)}
.expl{margin-top:12px;padding:12px;border-radius:12px;background:rgba(47,123,255,.1);font-size:.95rem}
.oe{font-size:.88rem;color:var(--mut);margin:4px 0 0}
/* math */
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;font-size:.92em;line-height:1.2}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px 1px}.frac>span:last-child{padding:1px 3px 0}
.sqrt{white-space:nowrap}.sqrt>span{border-top:1.5px solid currentColor;padding:0 2px;margin-left:1px}
.sum{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;line-height:1}
.sum b{font-size:1.5em;font-weight:400}.sum>span{font-size:.7em}
sup,sub{font-size:.72em;line-height:0}
.tm{font-variant-numeric:tabular-nums;font-weight:700;padding:3px 12px;border-radius:99px;background:var(--surf2);color:var(--cyan)}.tm.low{color:var(--bad)}
.two{grid-template-columns:1fr}@media(min-width:700px){.two{grid-template-columns:1fr 1fr}}
.m,.opt>span,.qtext,.expl,.oe{overflow-wrap:anywhere}
.m{font-family:"Cambria Math","STIX Two Math",Georgia,serif;font-style:normal}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}.lib{grid-template-columns:repeat(2,1fr)}h1{font-size:2rem}}
@media(max-width:480px){nav button span{display:none}nav button{padding:8px 9px}nav{gap:2px}.bar{padding:10px;gap:6px}.brand{font-size:.9rem;letter-spacing:.05em;gap:6px}.logo{width:28px;height:28px}}
</style>
</head>
<body>
<header><div class="bar">
  <div class="brand"><div class="logo" id="logo"></div>STATMASTER</div>
  <nav><button data-act="go" data-v="dash" id="n-dash"></button><button data-act="go" data-v="lib" id="n-lib"></button><button data-act="go" data-v="mock" id="n-mock"></button><button data-act="go" data-v="mistakes" id="n-mis"></button></nav>
</div></header>
<main id="app"></main>

<script>
/* =====================================================================
   1. CONFIGURATION
   ===================================================================== */
const CONFIG = {
  course: "Statistical Inference II",
  storageKey: "statmaster:v1",
  questionsPerQuiz: 10,
  mock: { questions: 20, minutes: 30 },
  sequentialUnlock: false   // true = a quiz unlocks only after the previous one is completed
};

/* =====================================================================
   2. QUESTION BANK  (DEMONSTRATION CONTENT – append new quiz objects here)
   ---------------------------------------------------------------------
   Maths mini-notation (used in question, options, explanations):
     {frac:num|den}   {sqrt:x}   {sum:i=1|n}   x^{2}   x_{i}
     {bar:X}  {hat:θ}   Greek letters: type them directly (μ σ θ λ Σ ...)
   Each quiz needs exactly CONFIG.questionsPerQuiz questions.
   Optional per quiz: locked: true
   ===================================================================== */
const QUIZ_BANK = [
{
  id: "quiz-1",
  title: "Criteria of Estimation",
  description: "Test your understanding of statistical estimators.",
  questions: [
  { id:1, question:"An estimator {hat:θ} of a parameter θ is called unbiased if:",
    options:{A:"E({hat:θ}) = θ", B:"Var({hat:θ}) = 0", C:"{hat:θ} = θ for every sample", D:"MSE({hat:θ}) = 0"},
    correctAnswer:"A",
    explanation:"Unbiasedness is defined through the expectation of the estimator: E({hat:θ}) = θ for all admissible θ, so the estimator is correct on average over repeated sampling.",
    optionExplanations:{A:"Correct: this is the definition of an unbiased estimator.",B:"Incorrect: zero variance means the estimator is constant, which says nothing about bias.",C:"Incorrect: an estimator varies from sample to sample; equality in every sample is not required.",D:"Incorrect: MSE = 0 would force both bias and variance to be zero, which is far stronger than unbiasedness."}},
  { id:2, question:"Let X_{1},…,X_{n} be i.i.d. with mean μ and variance σ^{2}. What is Var({bar:X})?",
    options:{A:"σ^{2}", B:"{frac:σ^{2}|n}", C:"{frac:σ|{sqrt:n}}", D:"nσ^{2}"},
    correctAnswer:"B",
    explanation:"Since {bar:X} = {frac:1|n}{sum:i=1|n}X_{i} and the observations are independent, Var({bar:X}) = {frac:1|n^{2}}·nσ^{2} = {frac:σ^{2}|n}.",
    optionExplanations:{A:"Incorrect: this is the variance of a single observation, not of the mean.",B:"Correct: averaging n independent observations divides the variance by n.",C:"Incorrect: σ/√n is the standard error (a standard deviation), not the variance.",D:"Incorrect: nσ² is the variance of the sum, not the mean."}},
  { id:3, question:"For a random sample from a population with variance σ^{2}, what is E[{frac:1|n}{sum:i=1|n}(X_{i} − {bar:X})^{2}]?",
    options:{A:"σ^{2}", B:"{frac:σ^{2}|n}", C:"{frac:(n−1)σ^{2}|n}", D:"{frac:nσ^{2}|n−1}"},
    correctAnswer:"C",
    explanation:"We have E[{sum:i=1|n}(X_{i} − {bar:X})^{2}] = (n−1)σ^{2}. Dividing by n gives {frac:(n−1)σ^{2}|n}, so this estimator is biased downwards. Dividing by n−1 instead gives the unbiased S^{2}.",
    optionExplanations:{A:"Incorrect: that would hold for the divisor n−1, not n.",B:"Incorrect: σ²/n is Var({bar:X}), a different quantity.",C:"Correct: the expected sum of squares is (n−1)σ², divided by n.",D:"Incorrect: this over-corrects; it is larger than σ²."}},
  { id:4, question:"An estimator has variance 4 and bias 3. Its mean squared error is:",
    options:{A:"7", B:"12", C:"13", D:"25"},
    correctAnswer:"C",
    explanation:"MSE = Var + (Bias)^{2} = 4 + 3^{2} = 13.",
    optionExplanations:{A:"Incorrect: 7 adds the bias without squaring it.",B:"Incorrect: 12 multiplies variance by bias.",C:"Correct: MSE = 4 + 9 = 13.",D:"Incorrect: 25 = (4 + 3)² − 24 is not the formula; MSE does not square the sum."}},
  { id:5, question:"Which pair of conditions together is sufficient for {hat:θ}_{n} to be a consistent estimator of θ?",
    options:{A:"Var({hat:θ}_{n}) → ∞ and bias → 0", B:"Bias → 0 and Var({hat:θ}_{n}) → 0 as n → ∞", C:"E({hat:θ}_{n}) = 0 and Var({hat:θ}_{n}) = 1", D:"Bias → 1 and Var({hat:θ}_{n}) → 0"},
    correctAnswer:"B",
    explanation:"If bias → 0 and variance → 0, then MSE → 0, and convergence in mean square implies convergence in probability, i.e. consistency.",
    optionExplanations:{A:"Incorrect: an exploding variance prevents convergence.",B:"Correct: MSE → 0, hence {hat:θ}_{n} → θ in probability.",C:"Incorrect: constant variance 1 does not shrink with n.",D:"Incorrect: a non-vanishing bias keeps the estimator away from θ."}},
  { id:6, question:"Two unbiased estimators have variances Var(T_{1}) = {frac:4|n} and Var(T_{2}) = {frac:9|n}. The relative efficiency of T_{1} with respect to T_{2}, Var(T_{2})/Var(T_{1}), is:",
    options:{A:"{frac:4|9}", B:"{frac:2|3}", C:"{frac:9|4}", D:"13"},
    correctAnswer:"C",
    explanation:"Relative efficiency = {frac:9/n|4/n} = {frac:9|4} = 2.25. Since it exceeds 1, T_{1} is more efficient.",
    optionExplanations:{A:"Incorrect: this is the reciprocal, the efficiency of T₂ relative to T₁.",B:"Incorrect: 2/3 compares standard deviations in the wrong direction.",C:"Correct: ratio of variances 9/n ÷ 4/n = 9/4.",D:"Incorrect: 13 is the sum of the numerators, not a ratio."}},
  { id:7, question:"X_{1},…,X_{n} is a random sample from Bernoulli(p). Which statistic is sufficient for p?",
    options:{A:"{sum:i=1|n}X_{i}", B:"X_{1} only", C:"X_{1}·X_{n}", D:"max(X_{1},…,X_{n})"},
    correctAnswer:"A",
    explanation:"The joint pmf is p^{Σx}(1−p)^{n−Σx}, which depends on the data only through ΣX_{i}. By the Fisher–Neyman factorisation theorem, ΣX_{i} is sufficient.",
    optionExplanations:{A:"Correct: the likelihood depends on the sample only through the total.",B:"Incorrect: discarding X₂,…,Xₙ loses information about p.",C:"Incorrect: the product only records whether both observations are 1.",D:"Incorrect: the maximum only tells whether any success occurred."}},
  { id:8, question:"For a N(μ, σ^{2}) sample of size n with σ^{2} known, the Cramér–Rao lower bound for the variance of any unbiased estimator of μ is:",
    options:{A:"{frac:σ^{2}|n}", B:"{frac:σ^{2}|n^{2}}", C:"nσ^{2}", D:"{frac:σ|n}"},
    correctAnswer:"A",
    explanation:"The Fisher information per observation is I(μ) = {frac:1|σ^{2}}, so the bound is {frac:1|nI(μ)} = {frac:σ^{2}|n}. Since Var({bar:X}) = σ²/n, {bar:X} attains the bound and is efficient.",
    optionExplanations:{A:"Correct: 1/(n·(1/σ²)) = σ²/n.",B:"Incorrect: this divides by n² instead of n.",C:"Incorrect: this is the variance of the sum.",D:"Incorrect: this is not even dimensionally a variance."}},
  { id:9, question:"X_{1},…,X_{n} is a random sample from Uniform(0, θ), so E(X) = {frac:θ|2}. Which is an unbiased estimator of θ?",
    options:{A:"{bar:X}", B:"2{bar:X}", C:"{frac:{bar:X}|2}", D:"{bar:X}^{2}"},
    correctAnswer:"B",
    explanation:"E(2{bar:X}) = 2E({bar:X}) = 2·{frac:θ|2} = θ, so 2{bar:X} is unbiased for θ.",
    optionExplanations:{A:"Incorrect: E({bar:X}) = θ/2, which underestimates θ.",B:"Correct: E(2X̄) = θ.",C:"Incorrect: E(X̄/2) = θ/4.",D:"Incorrect: E(X̄²) = θ²/12·(1/n) + θ²/4, which is not θ."}},
  { id:10, question:"{bar:X}^{2} is used to estimate μ^{2}. Given Var({bar:X}) = {frac:σ^{2}|n}, the bias of {bar:X}^{2} is:",
    options:{A:"0", B:"{frac:σ^{2}|n}", C:"{frac:σ^{2}|n^{2}}", D:"μ^{2}"},
    correctAnswer:"B",
    explanation:"E({bar:X}^{2}) = Var({bar:X}) + [E({bar:X})]^{2} = {frac:σ^{2}|n} + μ^{2}. Bias = E({bar:X}^{2}) − μ^{2} = {frac:σ^{2}|n}. It is positive but shrinks to 0 as n → ∞.",
    optionExplanations:{A:"Incorrect: squaring is non-linear, so unbiasedness of X̄ does not carry over.",B:"Correct: bias = σ²/n.",C:"Incorrect: the variance of X̄ is σ²/n, not σ²/n².",D:"Incorrect: μ² is the target, not the bias."}}
  ]
}
,
{"id": "quiz-2", "title": "Unbiasedness and Bias", "description": "Definitions, bias calculations, and unbiased transformations.", "questions": [{"id": 1, "question": "The bias of an estimator T of θ is defined as:", "options": {"A": "E(T) − θ", "B": "E(T) + θ", "C": "Var(T) − θ", "D": "θ − Var(T)"}, "correctAnswer": "A", "explanation": "Bias(T) = E(T) − θ. It measures the difference between the estimator's expected value and the parameter.", "optionExplanations": {"A": "Correct. Bias(T) = E(T) − θ. It measures the difference between the estimator's expected value and the parameter.", "B": "This option is not correct. Compare it with the definition or calculation explained below.", "C": "This option is not correct. Compare it with the definition or calculation explained below.", "D": "This option is not correct. Compare it with the definition or calculation explained below."}}, {"id": 2, "question": "If E(T) = θ + 4, the bias of T is:", "options": {"A": "0", "B": "4", "C": "θ + 4", "D": "−4"}, "correctAnswer": "B", "explanation": "Bias(T) = E(T) − θ = (θ + 4) − θ = 4. The estimator overestimates θ on average by 4.", "optionExplanations": {"A": "This option is not correct. Compare it with the definition or calculation explained below.", "B": "Correct. Bias(T) = E(T) − θ = (θ + 4) − θ = 4. The estimator overestimates θ on average by 4.", "C": "This option is not correct. Compare it with the definition or calculation explained below.", "D": "This option is not correct. Compare it with the definition or calculation explained below."}}, {"id": 3, "question": "If T is unbiased for θ, then E(3T − 2) equals:", "options": {"A": "3θ", "B": "3θ − 2", "C": "θ − 2", "D": "3θ + 2"}, "correctAnswer": "B", "explanation": "By linearity of expectation, E(3T − 2) = 3E(T) − 2 = 3θ − 2. This transformed estimator is not generally unbiased for θ.", "optionExplanations": {"A": "This option is not correct. Compare it with the definition or calculation explained below.", "B": "Correct. By linearity of expectation, E(3T − 2) = 3E(T) − 2 = 3θ − 2. This transformed estimator is not generally unbiased for θ.", "C": "This option is not correct. Compare it with the definition or calculation explained below.", "D": "This option is not correct. Compare it with the definition or calculation explained below."}}, {"id": 4, "question": "Suppose E(T) = 2θ. Which estimator is unbiased for θ?", "options": {"A": "T", "B": "T/2", "C": "2T", "D": "T − 2"}, "correctAnswer": "B", "explanation": "E(T/2) = E(T)/2 = 2θ/2 = θ. Therefore T/2 is unbiased.", "optionExplanations": {"A": "This option is not correct. Compare it with the definition or calculation explained below.", "B": "Correct. E(T/2) = E(T)/2 = 2θ/2 = θ. Therefore T/2 is unbiased.", "C": "This option is not correct. Compare it with the definition or calculation explained below.", "D": "This option is not correct. Compare it with the definition or calculation explained below."}}, {"id": 5, "question": "If T is unbiased for θ, the bias of T² for estimating θ² is generally:", "options": {"A": "Always zero", "B": "Always negative", "C": "Not necessarily zero", "D": "Always equal to θ"}, "correctAnswer": "C", "explanation": "Unbiasedness does not usually survive nonlinear transformations. E(T²) = Var(T) + [E(T)]² = Var(T) + θ², so the bias for θ² is Var(T), which is positive unless the variance is zero.", "optionExplanations": {"A": "This option is not correct. Compare it with the definition or calculation explained below.", "B": "This option is not correct. Compare it with the definition or calculation explained below.", "C": "Correct. Unbiasedness does not usually survive nonlinear transformations. E(T²) = Var(T) + [E(T)]² = Var(T) + θ², so the bias for θ² is Var(T), which is positive unless the variance is zero.", "D": "This option is not correct. Compare it with the definition or calculation explained below."}}, {"id": 6, "question": "Let X₁,…,Xₙ be a random sample with mean μ. Which estimator is unbiased for μ?", "options": {"A": "ΣXᵢ", "B": "X̄", "C": "nX̄", "D": "X̄/n"}, "correctAnswer": "B", "explanation": "E(X̄) = E(ΣXᵢ/n) = ΣE(Xᵢ)/n = nμ/n = μ.", "optionExplanations": {"A": "This option is not correct. Compare it with the definition or calculation explained below.", "B": "Correct. E(X̄) = E(ΣXᵢ/n) = ΣE(Xᵢ)/n = nμ/n = μ.", "C": "This option is not correct. Compare it with the definition or calculation explained below.", "D": "This option is not correct. Compare it with the definition or calculation explained below."}}, {"id": 7, "question": "If E(T) = θ − 5, then T is:", "options": {"A": "Unbiased", "B": "Biased downward by 5", "C": "Biased upward by 5", "D": "Consistent automatically"}, "correctAnswer": "B", "explanation": "Bias(T) = (θ − 5) − θ = −5. A negative bias means the estimator's expectation is below the target.", "optionExplanations": {"A": "This option is not correct. Compare it with the definition or calculation explained below.", "B": "Correct. Bias(T) = (θ − 5) − θ = −5. A negative bias means the estimator's expectation is below the target.", "C": "This option is not correct. Compare it with the definition or calculation explained below.", "D": "This option is not correct. Compare it with the definition or calculation explained below."}}, {"id": 8, "question": "Which statement is true about an unbiased estimator?", "options": {"A": "It equals θ in every sample", "B": "Its expected value equals θ", "C": "Its variance must be zero", "D": "It must have the smallest MSE"}, "correctAnswer": "B", "explanation": "Unbiasedness is a repeated-sampling property: E(T) = θ. A realised estimate can differ from θ, and unbiasedness alone does not guarantee small variance or minimum MSE.", "optionExplanations": {"A": "This option is not correct. Compare it with the definition or calculation explained below.", "B": "Correct. Unbiasedness is a repeated-sampling property: E(T) = θ. A realised estimate can differ from θ, and unbiasedness alone does not guarantee small variance or minimum MSE.", "C": "This option is not correct. Compare it with the definition or calculation explained below.", "D": "This option is not correct. Compare it with the definition or calculation explained below."}}, {"id": 9, "question": "If T₁ and T₂ are unbiased for θ, then T₁ + T₂ is unbiased for:", "options": {"A": "θ", "B": "2θ", "C": "θ²", "D": "0"}, "correctAnswer": "B", "explanation": "E(T₁ + T₂) = E(T₁) + E(T₂) = θ + θ = 2θ. Thus the sum is unbiased for 2θ, not θ.", "optionExplanations": {"A": "This option is not correct. Compare it with the definition or calculation explained below.", "B": "Correct. E(T₁ + T₂) = E(T₁) + E(T₂) = θ + θ = 2θ. Thus the sum is unbiased for 2θ, not θ.", "C": "This option is not correct. Compare it with the definition or calculation explained below.", "D": "This option is not correct. Compare it with the definition or calculation explained below."}}, {"id": 10, "question": "For an estimator T, MSE(T) can be written as:", "options": {"A": "Var(T) + [Bias(T)]²", "B": "Var(T) − Bias(T)", "C": "Var(T) × Bias(T)", "D": "[Var(T)]² + Bias(T)"}, "correctAnswer": "A", "explanation": "MSE(T) = E[(T − θ)²] = Var(T) + [E(T) − θ]². This separates random variability from systematic bias.", "optionExplanations": {"A": "Correct. MSE(T) = E[(T − θ)²] = Var(T) + [E(T) − θ]². This separates random variability from systematic bias.", "B": "This option is not correct. Compare it with the definition or calculation explained below.", "C": "This option is not correct. Compare it with the definition or calculation explained below.", "D": "This option is not correct. Compare it with the definition or calculation explained below."}}]},
