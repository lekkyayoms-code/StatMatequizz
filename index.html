{"id": "quiz-5", "title": "Sufficiency and Factorization Theorem", "description": "Identify sufficient statistics and apply the Fisher–Neyman factorization criterion.", "questions": [{"id": 1, "question": "A statistic T(X) is sufficient for θ if it:", "options": {"A": "Always equals θ", "B": "Is necessarily unbiased", "C": "Has zero variance", "D": "Contains all sample information about θ in the likelihood sense"}, "correctAnswer": "D", "explanation": "Sufficiency means that, in the formal statistical sense, the sample provides no additional information about θ once the sufficient statistic is known.", "optionExplanations": {"A": "This option is not correct. Compare it with the definition or calculation explained below.", "B": "This option is not correct. Compare it with the definition or calculation explained below.", "C": "This option is not correct. Compare it with the definition or calculation explained below.", "D": "Correct. Sufficiency means that, in the formal statistical sense, the sample provides no additional information about θ once the sufficient statistic is known."}}, {"id": 2, "question": "The Fisher–Neyman factorization theorem writes the joint density as:", "options": {"A": "f(x;θ) = g(T(x),θ)h(x)", "B": "f(x;θ) = g(x) + h(θ)", "C": "f(x;θ) = θT(x)", "D": "f(x;θ) = g(θ)/h(x) only"}, "correctAnswer": "A", "explanation": "If the joint density or pmf factors into g(T(x),θ)h(x), where h does not depend on θ, then T(X) is sufficient for θ. Under the usual regularity conditions, this is also a characterisation.", "optionExplanations": {"A": "Correct. If the joint density or pmf factors into g(T(x),θ)h(x), where h does not depend on θ, then T(X) is sufficient for θ. Under the usual regularity conditions, this is also a characterisation.", "B": "This option is not correct. Compare it with the definition or calculation explained below.", "C": "This option is not correct. Compare it with the definition or calculation explained below.", "D": "This option is not correct. Compare it with the definition or calculation explained below."}}, {"id": 3, "question": "For a Bernoulli(p) random sample, a sufficient statistic for p is:", "options": {"A": "X₁ only", "B": "The sample range only", "C": "ΣXᵢ", "D": "The sample maximum only"}, "correctAnswer": "C", "explanation": "The joint pmf is p^(Σxᵢ)(1−p)^(n−Σxᵢ). The data enter the parameter-dependent part through ΣXᵢ, so the sum is sufficient.", "optionExplanations": {"A": "This option is not correct. Compare it with the definition or calculation explained below.", "B": "This option is not correct. Compare it with the definition or calculation explained below.", "C": "Correct. The joint pmf is p^(Σxᵢ)(1−p)^(n−Σxᵢ). The data enter the parameter-dependent part through ΣXᵢ, so the sum is sufficient.", "D": "This option is not correct. Compare it with the definition or calculation explained below."}}, {"id": 4, "question": "For a Poisson(λ) random sample, the joint likelihood depends on the observations through:", "options": {"A": "Only X₁", "B": "The sample median only", "C": "ΣXᵢ", "D": "The sample maximum"}, "correctAnswer": "C", "explanation": "The joint pmf is proportional to e^(−nλ) λ^(Σxᵢ) times a factor independent of λ. Thus ΣXᵢ is sufficient for λ.", "optionExplanations": {"A": "This option is not correct. Compare it with the definition or calculation explained below.", "B": "This option is not correct. Compare it with the definition or calculation explained below.", "C": "Correct. The joint pmf is proportional to e^(−nλ) λ^(Σxᵢ) times a factor independent of λ. Thus ΣXᵢ is sufficient for λ.", "D": "This option is not correct. Compare it with the definition or calculation explained below."}}, {"id": 5, "question": "For a normal sample with known variance and unknown mean μ, a sufficient statistic for μ is:", "options": {"A": "X₁ only", "B": "X̄", "C": "The sample minimum", "D": "The sample range"}, "correctAnswer": "B", "explanation": "The normal likelihood with known variance can be expressed using ΣXᵢ, equivalently X̄, in its parameter-dependent part. Therefore X̄ is sufficient for μ.", "optionExplanations": {"A": "This option is not correct. Compare it with the definition or calculation explained below.", "B": "Correct. The normal likelihood with known variance can be expressed using ΣXᵢ, equivalently X̄, in its parameter-dependent part. Therefore X̄ is sufficient for μ.", "C": "This option is not correct. Compare it with the definition or calculation explained below.", "D": "This option is not correct. Compare it with the definition or calculation explained below."}}, {"id": 6, "question": "In the factorization f(x;θ)=g(T(x),θ)h(x), which factor must be free of θ?", "options": {"A": "Neither factor", "B": "g", "C": "Both must contain θ", "D": "h"}, "correctAnswer": "D", "explanation": "The factor h(x) may depend on the observed data but must not depend on θ. All parameter dependence is contained in g through T(x).", "optionExplanations": {"A": "This option is not correct. Compare it with the definition or calculation explained below.", "B": "This option is not correct. Compare it with the definition or calculation explained below.", "C": "This option is not correct. Compare it with the definition or calculation explained below.", "D": "Correct. The factor h(x) may depend on the observed data but must not depend on θ. All parameter dependence is contained in g through T(x)."}}, {"id": 7, "question": "A sufficient statistic is necessarily:", "options": {"A": "A function of the sample", "B": "A probability distribution", "C": "An unknown parameter", "D": "A confidence interval"}, "correctAnswer": "A", "explanation": "A statistic is a function of the sample that does not depend on unknown parameters. Sufficiency is an additional property of that statistic.", "optionExplanations": {"A": "Correct. A statistic is a function of the sample that does not depend on unknown parameters. Sufficiency is an additional property of that statistic.", "B": "This option is not correct. Compare it with the definition or calculation explained below.", "C": "This option is not correct. Compare it with the definition or calculation explained below.", "D": "This option is not correct. Compare it with the definition or calculation explained below."}}, {"id": 8, "question": "For an i.i.d. exponential sample with density f(x;λ)=λe^(−λx), x>0, a sufficient statistic for λ is:", "options": {"A": "X₁ only", "B": "ΣXᵢ", "C": "The sample maximum", "D": "The number of negative observations"}, "correctAnswer": "B", "explanation": "The joint density is λⁿ exp(−λΣxᵢ) for positive observations. Its parameter-dependent part uses the sample through ΣXᵢ.", "optionExplanations": {"A": "This option is not correct. Compare it with the definition or calculation explained below.", "B": "Correct. The joint density is λⁿ exp(−λΣxᵢ) for positive observations. Its parameter-dependent part uses the sample through ΣXᵢ.", "C": "This option is not correct. Compare it with the definition or calculation explained below.", "D": "This option is not correct. Compare it with the definition or calculation explained below."}}, {"id": 9, "question": "If the likelihood depends on the sample only through T(X), the factorization criterion indicates that T is:", "options": {"A": "Sufficient", "B": "Always unbiased", "C": "A confidence coefficient", "D": "Always consistent"}, "correctAnswer": "A", "explanation": "When the likelihood admits the required factorization with the parameter entering through T(X), T is sufficient for the parameter.", "optionExplanations": {"A": "Correct. When the likelihood admits the required factorization with the parameter entering through T(X), T is sufficient for the parameter.", "B": "This option is not correct. Compare it with the definition or calculation explained below.", "C": "This option is not correct. Compare it with the definition or calculation explained below.", "D": "This option is not correct. Compare it with the definition or calculation explained below."}}, {"id": 10, "question": "Which statement about sufficiency is correct?", "options": {"A": "A sufficient statistic must be normally distributed", "B": "A sufficient statistic summarises all sample information about the parameter", "C": "A sufficient statistic must be unbiased", "D": "Every statistic is sufficient"}, "correctAnswer": "B", "explanation": "Sufficiency is about information, not unbiasedness or a particular distribution. A sufficient statistic can be biased or unbiased depending on the statistic and parameter.", "optionExplanations": {"A": "This option is not correct. Compare it with the definition or calculation explained below.", "B": "Correct. Sufficiency is about information, not unbiasedness or a particular distribution. A sufficient statistic can be biased or unbiased depending on the statistic and parameter.", "C": "This option is not correct. Compare it with the definition or calculation explained below.", "D": "This option is not correct. Compare it with the definition or calculation explained below."}}]},
{"id": "quiz-6", "title": "Maximum Likelihood Estimation", "description": "Likelihood, log-likelihood, MLE calculations and invariance.", "questions": [{"id": 1, "question": "The maximum likelihood estimate of θ is the value of θ that:", "options": {"A": "Maximises the likelihood L(θ; x) for the observed data", "B": "Makes the sample variance zero", "C": "Makes E(θ̂) = θ", "D": "Minimises the likelihood"}, "correctAnswer": "A", "explanation": "L(θ; x) is the joint pdf/pmf of the observed data viewed as a function of θ. The MLE is the parameter value under which the observed sample is most probable (or has highest density), i.e. the maximiser of L.", "optionExplanations": {"A": "Correct. L(θ; x) is the joint pdf/pmf of the observed data viewed as a function of θ. The MLE is the parameter value under which the observed sample is most probable (or has highest density), i.e. the maximiser of L.", "B": "Incorrect. the sample variance is determined by the data, not by the choice of θ.", "C": "Incorrect. unbiasedness is a separate property; MLEs need not satisfy it.", "D": "Incorrect. minimising L would pick the least plausible parameter value."}}, {"id": 2, "question": "In 20 independent Bernoulli(p) trials there are 12 successes. The MLE of p is:", "options": {"A": "0.12", "B": "0.60", "C": "0.40", "D": "12"}, "correctAnswer": "B", "explanation": "Given: n = 20, Σxᵢ = 12. Likelihood L(p) = p^Σx (1−p)^(n−Σx). Log-likelihood ℓ = Σx·ln p + (n−Σx)·ln(1−p). Setting ℓ′ = Σx/p − (n−Σx)/(1−p) = 0 gives p̂ = Σx/n = 12/20 = 0.60.", "optionExplanations": {"A": "Incorrect. 0.12 is not a ratio of successes to trials.", "B": "Correct. Given: n = 20, Σxᵢ = 12. Likelihood L(p) = p^Σx (1−p)^(n−Σx). Log-likelihood ℓ = Σx·ln p + (n−Σx)·ln(1−p). Setting ℓ′ = Σx/p − (n−Σx)/(1−p) = 0 gives p̂ = Σx/n = 12/20 = 0.60.", "C": "Incorrect. 0.40 is the proportion of failures (8/20).", "D": "Incorrect. p is a probability and cannot exceed 1."}}, {"id": 3, "question": "A random sample from Poisson(λ) is 2, 4, 3, 5, 1. The MLE of λ is:", "options": {"A": "5", "B": "15", "C": "3", "D": "2.4"}, "correctAnswer": "C", "explanation": "For Poisson, L(λ) ∝ e^(−nλ) λ^Σx, so ℓ = −nλ + Σx·ln λ + constant. ℓ′ = −n + Σx/λ = 0 gives λ̂ = X̄. Here Σx = 15 and n = 5, so λ̂ = 15/5 = 3.", "optionExplanations": {"A": "Incorrect. 5 is the sample maximum.", "B": "Incorrect. 15 is the sum, not the mean.", "C": "Correct. For Poisson, L(λ) ∝ e^(−nλ) λ^Σx, so ℓ = −nλ + Σx·ln λ + constant. ℓ′ = −n + Σx/λ = 0 gives λ̂ = X̄. Here Σx = 15 and n = 5, so λ̂ = 15/5 = 3.", "D": "Incorrect. 2.4 is not the mean of these values (15/5 = 3)."}}, {"id": 4, "question": "A sample from the exponential density f(x;λ) = λe^(−λx), x > 0, has sample mean X̄ = 0.5. The MLE of λ is:", "options": {"A": "0.25", "B": "0.5", "C": "2", "D": "1"}, "correctAnswer": "C", "explanation": "L(λ) = λⁿ exp(−λΣx), so ℓ = n·ln λ − λΣx. ℓ′ = n/λ − Σx = 0 gives λ̂ = n/Σx = 1/X̄. With X̄ = 0.5, λ̂ = 1/0.5 = 2.", "optionExplanations": {"A": "Incorrect. 0.25 is X̄ squared, which has no role here.", "B": "Incorrect. 0.5 is the mean, which estimates 1/λ, not λ.", "C": "Correct. L(λ) = λⁿ exp(−λΣx), so ℓ = n·ln λ − λΣx. ℓ′ = n/λ − Σx = 0 gives λ̂ = n/Σx = 1/X̄. With X̄ = 0.5, λ̂ = 1/0.5 = 2.", "D": "Incorrect. 1 would correspond to X̄ = 1."}}, {"id": 5, "question": "Why do we usually maximise the log-likelihood ℓ(θ) = ln L(θ) instead of L(θ)?", "options": {"A": "ln L removes the need to differentiate", "B": "ln is increasing, so the maximiser is unchanged, and products become sums", "C": "ln L has a different maximiser than L", "D": "ln L is always positive"}, "correctAnswer": "B", "explanation": "Since ln is strictly increasing, L and ln L peak at the same θ. For an i.i.d. sample L = ∏f(xᵢ;θ), so ln L = Σ ln f(xᵢ;θ): a sum is far easier to differentiate than a product.", "optionExplanations": {"A": "Incorrect. we still differentiate ℓ (or otherwise maximise it).", "B": "Correct. Since ln is strictly increasing, L and ln L peak at the same θ. For an i.i.d. sample L = ∏f(xᵢ;θ), so ln L = Σ ln f(xᵢ;θ): a sum is far easier to differentiate than a product.", "C": "Incorrect. the maximiser is the same; that is the whole point.", "D": "Incorrect. ln L is negative whenever L < 1, which is typical."}}, {"id": 6, "question": "For a N(μ, σ²) sample, the MLE of σ² is:", "options": {"A": "(1/n)Σ(Xᵢ − X̄)²", "B": "X̄²", "C": "(1/(n−1))Σ(Xᵢ − X̄)²", "D": "(1/n)Σ(Xᵢ − μ)² with μ unknown"}, "correctAnswer": "A", "explanation": "Maximising ℓ(μ,σ²) gives μ̂ = X̄ and σ̂² = (1/n)Σ(Xᵢ − X̄)². This has E(σ̂²) = ((n−1)/n)σ², so it is biased, although consistent. Dividing by n−1 gives the unbiased S², which is not the MLE.", "optionExplanations": {"A": "Correct. Maximising ℓ(μ,σ²) gives μ̂ = X̄ and σ̂² = (1/n)Σ(Xᵢ − X̄)². This has E(σ̂²) = ((n−1)/n)σ², so it is biased, although consistent. Dividing by n−1 gives the unbiased S², which is not the MLE.", "B": "Incorrect. X̄² estimates μ², not σ².", "C": "Incorrect. that is the unbiased S², not the MLE.", "D": "Incorrect. μ is unknown, so it must be replaced by its MLE X̄."}}, {"id": 7, "question": "For a Poisson sample the MLE is λ̂ = 3. By the invariance property, the MLE of P(X = 0) = e^(−λ) is:", "options": {"A": "3e^(−3)", "B": "1/3", "C": "e^(3)", "D": "e^(−3)"}, "correctAnswer": "D", "explanation": "Invariance: if θ̂ is the MLE of θ, then g(θ̂) is the MLE of g(θ). Here g(λ) = e^(−λ), so the MLE is e^(−λ̂) = e^(−3) ≈ 0.0498.", "optionExplanations": {"A": "Incorrect. 3e^(−3) is P(X = 1), not P(X = 0).", "B": "Incorrect. 1/3 is not obtained by applying g to λ̂.", "C": "Incorrect. e³ > 1 cannot be a probability.", "D": "Correct. Invariance: if θ̂ is the MLE of θ, then g(θ̂) is the MLE of g(θ). Here g(λ) = e^(−λ), so the MLE is e^(−λ̂) = e^(−3) ≈ 0.0498."}}, {"id": 8, "question": "X₁,…,Xₙ is a sample from Uniform(0, θ). The data are 2.1, 3.7, 1.4, 3.0. The MLE of θ is:", "options": {"A": "1.4", "B": "4.0", "C": "2.55", "D": "3.7"}, "correctAnswer": "D", "explanation": "L(θ) = θ^(−n) for θ ≥ max(xᵢ) and 0 otherwise. θ^(−n) decreases in θ, so the likelihood is largest at the smallest allowed value, θ̂ = X₍ₙ₎ = max = 3.7. Calculus does not work here because the maximum occurs at the boundary.", "optionExplanations": {"A": "Incorrect. 1.4 is below observed values, giving likelihood 0.", "B": "Incorrect. 4.0 is allowed but gives a smaller likelihood than 3.7.", "C": "Incorrect. 2.55 is the sample mean; θ = 2.55 would make 3.7 impossible.", "D": "Correct. L(θ) = θ^(−n) for θ ≥ max(xᵢ) and 0 otherwise. θ^(−n) decreases in θ, so the likelihood is largest at the smallest allowed value, θ̂ = X₍ₙ₎ = max = 3.7. Calculus does not work here because the maximum occurs at the boundary."}}, {"id": 9, "question": "For Poisson data with n = 5 and Σxᵢ = 15, λ̂ = 3. The second derivative ℓ″(λ) = −Σxᵢ/λ² evaluated at λ̂ is:", "options": {"A": "−5/3", "B": "−1/3", "C": "5/3", "D": "−5"}, "correctAnswer": "A", "explanation": "From ℓ′ = −n + Σx/λ we get ℓ″ = −Σx/λ². At λ = 3: ℓ″ = −15/9 = −5/3 ≈ −1.67. It is negative, confirming that λ̂ = 3 is a maximum.", "optionExplanations": {"A": "Correct. From ℓ′ = −n + Σx/λ we get ℓ″ = −Σx/λ². At λ = 3: ℓ″ = −15/9 = −5/3 ≈ −1.67. It is negative, confirming that λ̂ = 3 is a maximum.", "B": "Incorrect. −1/3 does not use Σx = 15.", "C": "Incorrect. a positive value would indicate a minimum, not a maximum.", "D": "Incorrect. −15/3 = −5 divides by λ instead of λ²."}}, {"id": 10, "question": "Which statement about maximum likelihood estimators is correct?", "options": {"A": "They always equal the sample mean", "B": "They can be biased in small samples but are consistent under standard regularity conditions", "C": "They never exist for continuous distributions", "D": "They are always unbiased"}, "correctAnswer": "B", "explanation": "MLEs have good large-sample properties (consistency, asymptotic normality) under regularity conditions, but not unbiasedness in general. Example: σ̂² = (1/n)Σ(Xᵢ − X̄)² is biased for σ² yet consistent.", "optionExplanations": {"A": "Incorrect. the MLE depends on the model: for Poisson and exponential it differs from, or is a function of, X̄.", "B": "Correct. MLEs have good large-sample properties (consistency, asymptotic normality) under regularity conditions, but not unbiasedness in general. Example: σ̂² = (1/n)Σ(Xᵢ − X̄)² is biased for σ² yet consistent.", "C": "Incorrect. MLEs exist for many continuous models, e.g. the exponential.", "D": "Incorrect. the normal-variance MLE is a counterexample."}}]},
{"id": "quiz-7", "title": "Least Squares Method", "description": "Fit lines, compute slopes, residuals and R² from data.", "questions": [{"id": 1, "question": "In simple linear regression yᵢ = a + bxᵢ + εᵢ, the least squares estimates minimise:", "options": {"A": "Σ|xᵢ − yᵢ|", "B": "Σ(yᵢ − a − bxᵢ)", "C": "Σ(xᵢ − x̄)", "D": "Σ(yᵢ − a − bxᵢ)²"}, "correctAnswer": "D", "explanation": "Least squares chooses a and b to make the sum of squared vertical distances (residuals) between observed yᵢ and fitted a + bxᵢ as small as possible.", "optionExplanations": {"A": "Incorrect. this sums absolute differences between x and y, which is not the regression criterion.", "B": "Incorrect. the plain sum of residuals can be made zero by many poor lines.", "C": "Incorrect. this is identically zero and does not involve y.", "D": "Correct. Least squares chooses a and b to make the sum of squared vertical distances (residuals) between observed yᵢ and fitted a + bxᵢ as small as possible."}}, {"id": 2, "question": "Data (x, y): (1,2), (2,4), (3,5), (4,9). Then x̄ = 2.5, ȳ = 5, Sxx = 5 and Sxy = 11. The least squares slope b̂ = Sxy/Sxx is:", "options": {"A": "5", "B": "2.2", "C": "0.45", "D": "11"}, "correctAnswer": "B", "explanation": "Given Sxx = Σ(x−x̄)² = 2.25+0.25+0.25+2.25 = 5 and Sxy = Σ(x−x̄)(y−ȳ) = 4.5+0.5+0+6 = 11. Slope b̂ = Sxy/Sxx = 11/5 = 2.2.", "optionExplanations": {"A": "Incorrect. 5 is Sxx.", "B": "Correct. Given Sxx = Σ(x−x̄)² = 2.25+0.25+0.25+2.25 = 5 and Sxy = Σ(x−x̄)(y−ȳ) = 4.5+0.5+0+6 = 11. Slope b̂ = Sxy/Sxx = 11/5 = 2.2.", "C": "Incorrect. 0.45 inverts the ratio (5/11).", "D": "Incorrect. 11 is Sxy, not divided by Sxx."}}, {"id": 3, "question": "Using the same data, the least squares intercept â = ȳ − b̂x̄ is:", "options": {"A": "−0.5", "B": "0.5", "C": "7.5", "D": "2.5"}, "correctAnswer": "A", "explanation": "The fitted line passes through (x̄, ȳ). With b̂ = 2.2: â = 5 − 2.2×2.5 = 5 − 5.5 = −0.5.", "optionExplanations": {"A": "Correct. The fitted line passes through (x̄, ȳ). With b̂ = 2.2: â = 5 − 2.2×2.5 = 5 − 5.5 = −0.5.", "B": "Incorrect. the sign is wrong; 5 − 5.5 is negative.", "C": "Incorrect. 7.5 results from adding instead of subtracting 2.5.", "D": "Incorrect. 2.5 is x̄."}}, {"id": 4, "question": "Using the fitted line ŷ = −0.5 + 2.2x, the predicted y at x = 5 is:", "options": {"A": "12.5", "B": "11", "C": "8.3", "D": "10.5"}, "correctAnswer": "D", "explanation": "Substitute x = 5: ŷ = −0.5 + 2.2×5 = −0.5 + 11 = 10.5.", "optionExplanations": {"A": "Incorrect. 12.5 adds instead of subtracting 0.5 and miscounts.", "B": "Incorrect. 11 forgets the intercept −0.5.", "C": "Incorrect. 8.3 is the fitted value at x = 4.", "D": "Correct. Substitute x = 5: ŷ = −0.5 + 2.2×5 = −0.5 + 11 = 10.5."}}, {"id": 5, "question": "The normal equations for least squares in y = a + bx are:", "options": {"A": "Σy² = a² + b²", "B": "Σy = na + bΣx and Σxy = aΣx + bΣx²", "C": "Σx = na + bΣy only", "D": "Σy = a + bΣx and Σxy = a + bΣx²"}, "correctAnswer": "B", "explanation": "Setting ∂/∂a and ∂/∂b of Σ(y − a − bx)² to zero gives −2Σ(y − a − bx) = 0 and −2Σx(y − a − bx) = 0, which rearrange to Σy = na + bΣx and Σxy = aΣx + bΣx².", "optionExplanations": {"A": "Incorrect. there is no such condition; it is not the derivative result.", "B": "Correct. Setting ∂/∂a and ∂/∂b of Σ(y − a − bx)² to zero gives −2Σ(y − a − bx) = 0 and −2Σx(y − a − bx) = 0, which rearrange to Σy = na + bΣx and Σxy = aΣx + bΣx².", "C": "Incorrect. x and y are interchanged and only one equation is given.", "D": "Incorrect. the constant a appears n times in Σa = na."}}, {"id": 6, "question": "For the fitted line ŷ = −0.5 + 2.2x the residuals are 0.3, 0.1, −1.1 and 0.7 at x = 1, 2, 3, 4. The residual sum of squares (SSE) is:", "options": {"A": "2.2", "B": "3.0", "C": "1.8", "D": "0"}, "correctAnswer": "C", "explanation": "Residual = y − ŷ. Fitted values are 1.7, 3.9, 6.1, 8.3, giving residuals 0.3, 0.1, −1.1, 0.7. SSE = 0.09 + 0.01 + 1.21 + 0.49 = 1.80. (The plain residual sum is 0, but SSE squares them first.)", "optionExplanations": {"A": "Incorrect. 2.2 is the slope.", "B": "Incorrect. 3.0 does not match the squared residuals.", "C": "Correct. Residual = y − ŷ. Fitted values are 1.7, 3.9, 6.1, 8.3, giving residuals 0.3, 0.1, −1.1, 0.7. SSE = 0.09 + 0.01 + 1.21 + 0.49 = 1.80. (The plain residual sum is 0, but SSE squares them first.)", "D": "Incorrect. 0 is the sum of residuals, not of squares."}}, {"id": 7, "question": "The Gauss–Markov theorem says the least squares estimators are BLUE. Which assumption is NOT required for this?", "options": {"A": "Errors have constant variance", "B": "Errors are normally distributed", "C": "Errors have mean zero", "D": "Errors are uncorrelated"}, "correctAnswer": "B", "explanation": "BLUE (best linear unbiased estimator) needs E(ε)=0, constant variance σ² and uncorrelated errors. Normality is not needed; it is only required for exact t and F inference.", "optionExplanations": {"A": "Incorrect. constant variance is required for the minimum-variance conclusion.", "B": "Correct. BLUE (best linear unbiased estimator) needs E(ε)=0, constant variance σ² and uncorrelated errors. Normality is not needed; it is only required for exact t and F inference.", "C": "Incorrect. zero mean is required for unbiasedness.", "D": "Incorrect. correlated errors would invalidate the variance result."}}, {"id": 8, "question": "If Var(εᵢ) = σ² = 10 and Sxx = 5, then Var(b̂) = σ²/Sxx equals:", "options": {"A": "2", "B": "0.5", "C": "10", "D": "50"}, "correctAnswer": "A", "explanation": "For simple regression, Var(b̂) = σ²/Σ(xᵢ−x̄)². Substituting: 10/5 = 2.", "optionExplanations": {"A": "Correct. For simple regression, Var(b̂) = σ²/Σ(xᵢ−x̄)². Substituting: 10/5 = 2.", "B": "Incorrect. 0.5 is 5/10, the reciprocal.", "C": "Incorrect. 10 is σ² without dividing by Sxx.", "D": "Incorrect. 50 multiplies instead of dividing."}}, {"id": 9, "question": "With SSE = 1.8 and n = 4 observations, the unbiased estimate of σ² in simple regression is SSE/(n − 2) =", "options": {"A": "0.45", "B": "0.6", "C": "0.9", "D": "1.8"}, "correctAnswer": "C", "explanation": "Two parameters (a and b) are estimated, leaving n − 2 = 2 degrees of freedom. σ̂² = 1.8/2 = 0.9.", "optionExplanations": {"A": "Incorrect. 0.45 divides by n(=4) twice or by 4.", "B": "Incorrect. 0.6 would divide by 3, which is n − 1.", "C": "Correct. Two parameters (a and b) are estimated, leaving n − 2 = 2 degrees of freedom. σ̂² = 1.8/2 = 0.9.", "D": "Incorrect. 1.8 is SSE undivided."}}, {"id": 10, "question": "For the same data SST = Σ(y−ȳ)² = 26 and SSE = 1.8. The coefficient of determination R² = 1 − SSE/SST is approximately:", "options": {"A": "0.931", "B": "0.069", "C": "1.000", "D": "0.600"}, "correctAnswer": "A", "explanation": "R² = 1 − 1.8/26 = 1 − 0.0692 = 0.931. About 93% of the variation in y is explained by the linear relationship with x.", "optionExplanations": {"A": "Correct. R² = 1 − 1.8/26 = 1 − 0.0692 = 0.931. About 93% of the variation in y is explained by the linear relationship with x.", "B": "Incorrect. 0.069 is SSE/SST, the unexplained fraction.", "C": "Incorrect. 1.000 would need SSE = 0, a perfect fit.", "D": "Incorrect. 0.600 does not follow from these values."}}]},
{"id": "quiz-8", "title": "Method of Moments", "description": "Equate sample and population moments to estimate parameters.", "questions": [{"id": 1, "question": "The method of moments estimates parameters by:", "options": {"A": "Minimising the sum of squared residuals", "B": "Equating sample moments to the corresponding population moments and solving", "C": "Maximising the likelihood", "D": "Setting the sample variance to zero"}, "correctAnswer": "B", "explanation": "A population moment such as E(X) is a function of the parameters. The method replaces it by the sample moment (X̄ for the first, (1/n)ΣXᵢ² for the second) and solves the resulting equations for the parameters.", "optionExplanations": {"A": "Incorrect. that describes least squares.", "B": "Correct. A population moment such as E(X) is a function of the parameters. The method replaces it by the sample moment (X̄ for the first, (1/n)ΣXᵢ² for the second) and solves the resulting equations for the parameters.", "C": "Incorrect. that describes maximum likelihood.", "D": "Incorrect. the sample variance is not forced to zero by any estimation method."}}, {"id": 2, "question": "A sample from f(x;λ) = λe^(−λx), x > 0, has X̄ = 0.25. The method of moments estimate of λ is:", "options": {"A": "0.25", "B": "0.0625", "C": "2", "D": "4"}, "correctAnswer": "D", "explanation": "Given: E(X) = 1/λ. Equate 1/λ = X̄, so λ̃ = 1/X̄. Substituting: 1/0.25 = 4.", "optionExplanations": {"A": "Incorrect. 0.25 is the mean, which estimates 1/λ, not λ.", "B": "Incorrect. 0.0625 = 0.25², which is not required.", "C": "Incorrect. 2 would need X̄ = 0.5.", "D": "Correct. Given: E(X) = 1/λ. Equate 1/λ = X̄, so λ̃ = 1/X̄. Substituting: 1/0.25 = 4."}}, {"id": 3, "question": "A Poisson(λ) sample is 2, 3, 4, 3. The method of moments estimate of λ is:", "options": {"A": "2.4", "B": "12", "C": "3", "D": "4"}, "correctAnswer": "C", "explanation": "For the Poisson distribution E(X) = λ. Equating gives λ̃ = X̄ = (2+3+4+3)/4 = 12/4 = 3.", "optionExplanations": {"A": "Incorrect. 2.4 is not the sample mean.", "B": "Incorrect. 12 is the sum, not the mean.", "C": "Correct. For the Poisson distribution E(X) = λ. Equating gives λ̃ = X̄ = (2+3+4+3)/4 = 12/4 = 3.", "D": "Incorrect. 4 is the maximum observation."}}, {"id": 4, "question": "For Uniform(0, θ) we have E(X) = θ/2. If X̄ = 3.2, the method of moments estimate of θ is:", "options": {"A": "6.4", "B": "1.6", "C": "3.2", "D": "9.6"}, "correctAnswer": "A", "explanation": "Equate θ/2 = X̄, so θ̃ = 2X̄ = 2 × 3.2 = 6.4. Note that 6.4 is consistent with sample values up to 6.4 only; the estimate can in principle be below the sample maximum.", "optionExplanations": {"A": "Correct. Equate θ/2 = X̄, so θ̃ = 2X̄ = 2 × 3.2 = 6.4. Note that 6.4 is consistent with sample values up to 6.4 only; the estimate can in principle be below the sample maximum.", "B": "Incorrect. 1.6 halves the mean instead of doubling it.", "C": "Incorrect. 3.2 forgets the factor 2.", "D": "Incorrect. 9.6 multiplies by 3."}}, {"id": 5, "question": "A normal sample is 2, 4, 6. Using first and second moments, the method of moments estimate of σ² is (1/n)Σ(Xᵢ − X̄)². Its value is:", "options": {"A": "2", "B": "4", "C": "8/3", "D": "8"}, "correctAnswer": "C", "explanation": "Given X̄ = 4. Deviations: −2, 0, 2, so Σ(Xᵢ − X̄)² = 4 + 0 + 4 = 8. Since the second-moment equation gives σ̃² = (1/n)ΣXᵢ² − X̄² = (1/n)Σ(Xᵢ − X̄)², we get 8/3 ≈ 2.67.", "optionExplanations": {"A": "Incorrect. 2 divides by 4 instead of n = 3.", "B": "Incorrect. 4 divides by n − 1 (the unbiased S²), not n.", "C": "Correct. Given X̄ = 4. Deviations: −2, 0, 2, so Σ(Xᵢ − X̄)² = 4 + 0 + 4 = 8. Since the second-moment equation gives σ̃² = (1/n)ΣXᵢ² − X̄² = (1/n)Σ(Xᵢ − X̄)², we get 8/3 ≈ 2.67.", "D": "Incorrect. 8 is the sum of squares, not divided by n."}}, {"id": 6, "question": "A Gamma distribution has two unknown parameters. At least how many moment equations does the method of moments need?", "options": {"A": "None", "B": "2", "C": "1", "D": "3"}, "correctAnswer": "B", "explanation": "To solve for k unknown parameters we generally need k equations. Two parameters therefore need two equations, usually from the first and second moments.", "optionExplanations": {"A": "Incorrect. the method needs equations; it cannot proceed without them.", "B": "Correct. To solve for k unknown parameters we generally need k equations. Two parameters therefore need two equations, usually from the first and second moments.", "C": "Incorrect. one equation cannot determine two unknowns.", "D": "Incorrect. three equations are more than necessary."}}, {"id": 7, "question": "X ~ Binomial(m, p) with m = 10 known. Sample mean is X̄ = 3. The method of moments estimate of p is:", "options": {"A": "0.3", "B": "0.7", "C": "3", "D": "30"}, "correctAnswer": "A", "explanation": "E(X) = mp. Equate mp = X̄, so p̃ = X̄/m = 3/10 = 0.3.", "optionExplanations": {"A": "Correct. E(X) = mp. Equate mp = X̄, so p̃ = X̄/m = 3/10 = 0.3.", "B": "Incorrect. 0.7 is 1 − p̃.", "C": "Incorrect. 3 is the mean number of successes, not a probability.", "D": "Incorrect. 30 multiplies instead of dividing."}}, {"id": 8, "question": "X ~ Uniform(−θ, θ). Why can the first moment not be used to estimate θ?", "options": {"A": "The first moment exists only for discrete data", "B": "E(X) = 0 for every θ, so it contains no information about θ", "C": "Because X̄ is always 0", "D": "E(X) is infinite"}, "correctAnswer": "B", "explanation": "The distribution is symmetric about 0, so E(X) = 0 regardless of θ. One must use the second moment: E(X²) = θ²/3, giving θ̃ = √(3·(1/n)ΣXᵢ²).", "optionExplanations": {"A": "Incorrect. moments exist for continuous distributions too.", "B": "Correct. The distribution is symmetric about 0, so E(X) = 0 regardless of θ. One must use the second moment: E(X²) = θ²/3, giving θ̃ = √(3·(1/n)ΣXᵢ²).", "C": "Incorrect. X̄ is a random sample average and is generally not 0.", "D": "Incorrect. the mean exists and equals 0."}}, {"id": 9, "question": "X ~ Gamma with shape α and scale β has E(X) = αβ and Var(X) = αβ². A sample has mean 6 and (1/n)Σ(Xᵢ − X̄)² = 12. The method of moments estimates are:", "options": {"A": "α̃ = 6, β̃ = 12", "B": "α̃ = 2, β̃ = 3", "C": "α̃ = 12, β̃ = 6", "D": "α̃ = 3, β̃ = 2"}, "correctAnswer": "D", "explanation": "Equations: αβ = 6 and αβ² = 12. Dividing the second by the first gives β̃ = 12/6 = 2. Then α̃ = 6/β̃ = 6/2 = 3. Check: 3×2 = 6 and 3×4 = 12.", "optionExplanations": {"A": "Incorrect. these values give mean 72, not 6.", "B": "Incorrect. these values give mean 6 but variance 18, not 12.", "C": "Incorrect. these values give mean 72, not 6.", "D": "Correct. Equations: αβ = 6 and αβ² = 12. Dividing the second by the first gives β̃ = 12/6 = 2. Then α̃ = 6/β̃ = 6/2 = 3. Check: 3×2 = 6 and 3×4 = 12."}}, {"id": 10, "question": "For Uniform(0, θ), the method of moments estimator is 2X̄ and the MLE is max(Xᵢ). Which statement is true?", "options": {"A": "2X̄ is unbiased but the MLE is biased", "B": "Neither estimator can be computed", "C": "The MLE is unbiased but 2X̄ is biased", "D": "The two estimators are always identical"}, "correctAnswer": "A", "explanation": "E(2X̄) = 2·θ/2 = θ, so 2X̄ is unbiased. The maximum is always at most θ, so E(max) = (n/(n+1))θ < θ, so the MLE is biased downward. Different principles can give different estimators.", "optionExplanations": {"A": "Correct. E(2X̄) = 2·θ/2 = θ, so 2X̄ is unbiased. The maximum is always at most θ, so E(max) = (n/(n+1))θ < θ, so the MLE is biased downward. Different principles can give different estimators.", "B": "Incorrect. both are easily computed from the sample.", "C": "Incorrect. the roles are reversed.", "D": "Incorrect. they give different values on the same data."}}]},
{"id": "quiz-9", "title": "Point Estimation", "description": "Estimators vs estimates, standard errors, MSE and basic estimation calculations.", "questions": [{"id": 1, "question": "What is the difference between an estimator and an estimate?", "options": {"A": "An estimator is the true parameter", "B": "An estimator is a rule (a function of the random sample); an estimate is its numerical value for observed data", "C": "An estimate is random; an estimator is a fixed number", "D": "They are identical"}, "correctAnswer": "B", "explanation": "An estimator such as X̄ is a random variable because it depends on the random sample, so it has a sampling distribution. An estimate, such as x̄ = 7 from one observed sample, is a single number.", "optionExplanations": {"A": "Incorrect. the parameter is the unknown target, not the estimator.", "B": "Correct. An estimator such as X̄ is a random variable because it depends on the random sample, so it has a sampling distribution. An estimate, such as x̄ = 7 from one observed sample, is a single number.", "C": "Incorrect. it is the estimator that is random.", "D": "Incorrect. they are different objects."}}, {"id": 2, "question": "The observed sample is 4, 6, 8, 10. The point estimate of the population mean is:", "options": {"A": "8", "B": "7", "C": "6", "D": "28"}, "correctAnswer": "B", "explanation": "A natural point estimator of μ is X̄ = ΣXᵢ/n. With ΣXᵢ = 28 and n = 4, x̄ = 28/4 = 7.", "optionExplanations": {"A": "Incorrect. 8 is not the mean of these values.", "B": "Correct. A natural point estimator of μ is X̄ = ΣXᵢ/n. With ΣXᵢ = 28 and n = 4, x̄ = 28/4 = 7.", "C": "Incorrect. 6 is the second value only.", "D": "Incorrect. 28 is the sum."}}, {"id": 3, "question": "A sample is 2, 4, 6. The unbiased estimate of the population variance, S² = Σ(xᵢ − x̄)²/(n − 1), is:", "options": {"A": "8/3", "B": "2", "C": "4", "D": "8"}, "correctAnswer": "C", "explanation": "Given x̄ = 4 and deviations −2, 0, 2: Σ(xᵢ − x̄)² = 8. S² = 8/(3 − 1) = 4.", "optionExplanations": {"A": "Incorrect. 8/3 divides by n, which gives a biased estimator.", "B": "Incorrect. 2 divides by 4 and does not use n − 1.", "C": "Correct. Given x̄ = 4 and deviations −2, 0, 2: Σ(xᵢ − x̄)² = 8. S² = 8/(3 − 1) = 4.", "D": "Incorrect. 8 is the sum of squares only."}}, {"id": 4, "question": "Population standard deviation is σ = 12. For n = 36, the standard error of X̄ is:", "options": {"A": "6", "B": "12", "C": "0.33", "D": "2"}, "correctAnswer": "D", "explanation": "The standard error is the standard deviation of X̄: σ/√n = 12/√36 = 12/6 = 2.", "optionExplanations": {"A": "Incorrect. 6 is √n, not the standard error.", "B": "Incorrect. 12 is σ for a single observation.", "C": "Incorrect. 0.33 equals 12/36, which forgets the square root.", "D": "Correct. The standard error is the standard deviation of X̄: σ/√n = 12/√36 = 12/6 = 2."}}, {"id": 5, "question": "T₁ is unbiased with variance 9. T₂ has bias 1 and variance 4. Comparing MSE, which estimator is preferred?", "options": {"A": "T₂, since MSE(T₂) = 5 < MSE(T₁) = 9", "B": "T₁, since it is unbiased", "C": "They are equal", "D": "Cannot be compared"}, "correctAnswer": "A", "explanation": "MSE = Var + Bias². MSE(T₁) = 9 + 0 = 9. MSE(T₂) = 4 + 1² = 5. T₂ has the smaller MSE, so a little bias is worth it for lower variance.", "optionExplanations": {"A": "Correct. MSE = Var + Bias². MSE(T₁) = 9 + 0 = 9. MSE(T₂) = 4 + 1² = 5. T₂ has the smaller MSE, so a little bias is worth it for lower variance.", "B": "Incorrect. unbiasedness alone does not minimise MSE.", "C": "Incorrect. 9 ≠ 5.", "D": "Incorrect. MSE gives a direct numerical comparison."}}, {"id": 6, "question": "In a sample of 150 voters, 45 support a policy. The point estimate of the population proportion is:", "options": {"A": "3.33", "B": "0.30", "C": "0.70", "D": "0.45"}, "correctAnswer": "B", "explanation": "The estimator of a proportion is p̂ = (number of successes)/n = 45/150 = 0.30.", "optionExplanations": {"A": "Incorrect. 3.33 is 150/45, the inverted ratio.", "B": "Correct. The estimator of a proportion is p̂ = (number of successes)/n = 45/150 = 0.30.", "C": "Incorrect. 0.70 is the proportion who do not support.", "D": "Incorrect. 0.45 is not a ratio from these values."}}, {"id": 7, "question": "X₁,…,Xₙ have known mean μ and unknown variance σ². The estimator (1/n)Σ(Xᵢ − μ)² has expectation:", "options": {"A": "σ²", "B": "(n−1)σ²/n", "C": "nσ²", "D": "μ²"}, "correctAnswer": "A", "explanation": "Each term has E(Xᵢ − μ)² = σ², so E[(1/n)Σ(Xᵢ − μ)²] = (1/n)·nσ² = σ². It is unbiased because μ is known; the correction n − 1 is needed only when μ is replaced by X̄.", "optionExplanations": {"A": "Correct. Each term has E(Xᵢ − μ)² = σ², so E[(1/n)Σ(Xᵢ − μ)²] = (1/n)·nσ² = σ². It is unbiased because μ is known; the correction n − 1 is needed only when μ is replaced by X̄.", "B": "Incorrect. that is the result when X̄ replaces μ.", "C": "Incorrect. this multiplies by n instead of averaging.", "D": "Incorrect. μ² is the squared mean."}}, {"id": 8, "question": "X₁, X₂ are independent with mean μ and variance σ². The variance of T = (X₁ + 2X₂)/3 is:", "options": {"A": "3σ²/9", "B": "σ²", "C": "σ²/2", "D": "5σ²/9"}, "correctAnswer": "D", "explanation": "Var(T) = (1/9)[Var(X₁) + 4Var(X₂)] by independence = (1/9)(σ² + 4σ²) = 5σ²/9. Also E(T) = (μ + 2μ)/3 = μ, so T is unbiased but less efficient than (X₁ + X₂)/2, which has variance σ²/2.", "optionExplanations": {"A": "Incorrect. 3σ²/9 loses the factor 4 on Var(X₂).", "B": "Incorrect. σ² would hold for a single observation.", "C": "Incorrect. σ²/2 is the variance of the simple average.", "D": "Correct. Var(T) = (1/9)[Var(X₁) + 4Var(X₂)] by independence = (1/9)(σ² + 4σ²) = 5σ²/9. Also E(T) = (μ + 2μ)/3 = μ, so T is unbiased but less efficient than (X₁ + X₂)/2, which has variance σ²/2."}}, {"id": 9, "question": "Assume μ, σ and θ are unknown. Which of the following is a statistic?", "options": {"A": "max(X₁,…,Xₙ)", "B": "(X₁ + … + Xₙ)/θ", "C": "X̄ − μ", "D": "σ²/n"}, "correctAnswer": "A", "explanation": "A statistic is a function of the sample alone and contains no unknown parameters. max(X₁,…,Xₙ) qualifies. The others involve μ, θ or σ.", "optionExplanations": {"A": "Correct. A statistic is a function of the sample alone and contains no unknown parameters. max(X₁,…,Xₙ) qualifies. The others involve μ, θ or σ.", "B": "Incorrect. it contains the unknown θ.", "C": "Incorrect. it contains the unknown μ.", "D": "Incorrect. σ² is an unknown parameter."}}, {"id": 10, "question": "A sample of n = 25 has standard deviation s = 5. The estimated standard error of X̄ is:", "options": {"A": "5", "B": "0.2", "C": "1", "D": "25"}, "correctAnswer": "C", "explanation": "Estimated standard error = s/√n = 5/√25 = 5/5 = 1.", "optionExplanations": {"A": "Incorrect. 5 is s, the standard deviation of single observations.", "B": "Incorrect. 0.2 is 5/25, which forgets the square root.", "C": "Correct. Estimated standard error = s/√n = 5/√25 = 5/5 = 1.", "D": "Incorrect. 25 is the sample size."}}]},
{"id": "quiz-10", "title": "Confidence Intervals", "description": "One-sample z and t intervals, proportions, sample size and interpretation.", "questions": [{"id": 1, "question": "A 95% confidence interval for μ is computed from a sample. What is the correct interpretation of the 95%?", "options": {"A": "95% of the observations lie in the interval", "B": "There is a 95% probability that μ lies in this particular interval", "C": "If the sampling were repeated many times, about 95% of such intervals would contain μ", "D": "μ varies and falls in the interval 95% of the time"}, "correctAnswer": "C", "explanation": "μ is a fixed unknown constant; the interval is random because it depends on the sample. The 95% describes the long-run success rate of the procedure: about 95% of intervals built this way capture μ. Once computed, a specific interval either contains μ or it does not.", "optionExplanations": {"A": "Incorrect. a CI is about μ, not about the spread of individual observations.", "B": "Incorrect. μ is fixed, so probability statements about it for one computed interval are not valid.", "C": "Correct. μ is a fixed unknown constant; the interval is random because it depends on the sample. The 95% describes the long-run success rate of the procedure: about 95% of intervals built this way capture μ. Once computed, a specific interval either contains μ or it does not.", "D": "Incorrect. it is the interval that varies, not μ."}}, {"id": 2, "question": "A normal population has σ = 10. A sample of n = 25 gives x̄ = 50. The 95% confidence interval for μ, x̄ ± 1.96σ/√n, is:", "options": {"A": "(46.08, 53.92)", "B": "(40, 60)", "C": "(30.4, 69.6)", "D": "(48.04, 51.96)"}, "correctAnswer": "A", "explanation": "Given: x̄ = 50, σ = 10, n = 25, z = 1.96. SE = σ/√n = 10/5 = 2. Margin = 1.96 × 2 = 3.92. Interval = 50 ± 3.92 = (46.08, 53.92).", "optionExplanations": {"A": "Correct. Given: x̄ = 50, σ = 10, n = 25, z = 1.96. SE = σ/√n = 10/5 = 2. Margin = 1.96 × 2 = 3.92. Interval = 50 ± 3.92 = (46.08, 53.92).", "B": "Incorrect. this is x̄ ± σ, which is not a confidence interval.", "C": "Incorrect. this uses σ instead of σ/√n (1.96 × 10 = 19.6).", "D": "Incorrect. this uses SE = 1, i.e. σ/√n with n = 100."}}, {"id": 3, "question": "All else equal, if the sample size is multiplied by 4, the width of a z confidence interval for μ:", "options": {"A": "Is halved", "B": "Is unchanged", "C": "Is quartered", "D": "Is doubled"}, "correctAnswer": "A", "explanation": "Width = 2zσ/√n. Replacing n by 4n changes √n to 2√n, so the width is divided by 2.", "optionExplanations": {"A": "Correct. Width = 2zσ/√n. Replacing n by 4n changes √n to 2√n, so the width is divided by 2.", "B": "Incorrect. n appears in the margin of error.", "C": "Incorrect. width depends on √n, not n, so it is not quartered.", "D": "Incorrect. larger samples shrink the interval."}}, {"id": 4, "question": "Moving from a 95% to a 99% confidence level, using the same data, makes the interval:", "options": {"A": "Narrower", "B": "Shifted but not wider", "C": "The same", "D": "Wider"}, "correctAnswer": "D", "explanation": "A higher confidence level needs a larger critical value (z = 2.576 instead of 1.96), so the margin of error rises. We gain confidence in capturing μ at the price of precision.", "optionExplanations": {"A": "Incorrect. the larger critical value widens it.", "B": "Incorrect. the centre x̄ stays put; only the margin changes.", "C": "Incorrect. the margin changes through z.", "D": "Correct. A higher confidence level needs a larger critical value (z = 2.576 instead of 1.96), so the margin of error rises. We gain confidence in capturing μ at the price of precision."}}, {"id": 5, "question": "A sample of n = 16 from a normal population has x̄ = 20 and s = 8. Using t(0.025, 15) = 2.131, the 95% CI for μ is:", "options": {"A": "(16.0, 24.0)", "B": "(15.74, 24.26)", "C": "(3.0, 37.0)", "D": "(18.0, 22.0)"}, "correctAnswer": "B", "explanation": "σ is unknown and n is small, so use the t interval x̄ ± t·s/√n with 15 df. SE = 8/√16 = 2. Margin = 2.131 × 2 = 4.262. Interval = 20 ± 4.262 = (15.738, 24.262).", "optionExplanations": {"A": "Incorrect. the margin 4 is about 2 × SE and ignores the larger t critical value.", "B": "Correct. σ is unknown and n is small, so use the t interval x̄ ± t·s/√n with 15 df. SE = 8/√16 = 2. Margin = 2.131 × 2 = 4.262. Interval = 20 ± 4.262 = (15.738, 24.262).", "C": "Incorrect. this multiplies t by s (≈17) instead of by s/√n = 2.", "D": "Incorrect. a margin of 2 is just one SE, without multiplying by t."}}, {"id": 6, "question": "A sample of n = 9 from a normal population with unknown σ is used to build a CI for μ. The t distribution has how many degrees of freedom?", "options": {"A": "7", "B": "9", "C": "8", "D": "10"}, "correctAnswer": "C", "explanation": "The statistic (X̄ − μ)/(S/√n) has a t distribution with n − 1 degrees of freedom because one degree is used to estimate μ in S. Here n − 1 = 8.", "optionExplanations": {"A": "Incorrect. n − 2 belongs to simple regression.", "B": "Incorrect. n would apply only if μ were known.", "C": "Correct. The statistic (X̄ − μ)/(S/√n) has a t distribution with n − 1 degrees of freedom because one degree is used to estimate μ in S. Here n − 1 = 8.", "D": "Incorrect. n + 1 is never used for a one-sample t."}}, {"id": 7, "question": "σ = 15. How large must n be so that the 95% margin of error for μ is at most 3 (z = 1.96)?", "options": {"A": "97", "B": "865", "C": "33", "D": "96"}, "correctAnswer": "A", "explanation": "Need zσ/√n ≤ E, so n ≥ (zσ/E)² = (1.96 × 15/3)² = 9.8² = 96.04. Always round up: n = 97.", "optionExplanations": {"A": "Correct. Need zσ/√n ≤ E, so n ≥ (zσ/E)² = (1.96 × 15/3)² = 9.8² = 96.04. Always round up: n = 97.", "B": "Incorrect. 865 is not produced by n = (zσ/E)²; it is far too large.", "C": "Incorrect. 33 omits squaring.", "D": "Incorrect. 96 is below 96.04 and would give a margin slightly above 3."}}, {"id": 8, "question": "In a poll, 60 of 200 respondents support a proposal. Using p̂ ± 1.96√(p̂(1−p̂)/n), the 95% CI for p is approximately:", "options": {"A": "(0.20, 0.40)", "B": "(0.237, 0.363)", "C": "(0.30, 0.36)", "D": "(0.10, 0.50)"}, "correctAnswer": "B", "explanation": "p̂ = 60/200 = 0.30. SE = √(0.30 × 0.70/200) = √0.00105 ≈ 0.0324. Margin = 1.96 × 0.0324 ≈ 0.0635. Interval = 0.30 ± 0.0635 = (0.2365, 0.3635).", "optionExplanations": {"A": "Incorrect. this margin of 0.10 does not follow from the SE.", "B": "Correct. p̂ = 60/200 = 0.30. SE = √(0.30 × 0.70/200) = √0.00105 ≈ 0.0324. Margin = 1.96 × 0.0324 ≈ 0.0635. Interval = 0.30 ± 0.0635 = (0.2365, 0.3635).", "C": "Incorrect. the interval must be centred on p̂ = 0.30.", "D": "Incorrect. this margin of 0.20 is far too large."}}, {"id": 9, "question": "A 95% confidence interval for μ is (12, 18). The margin of error and the sample mean are:", "options": {"A": "Margin 3, x̄ = 12", "B": "Margin 6, x̄ = 18", "C": "Margin 6, x̄ = 15", "D": "Margin 3, x̄ = 15"}, "correctAnswer": "D", "explanation": "A CI has the form x̄ ± margin, so it is symmetric about x̄. x̄ = (12 + 18)/2 = 15, and margin = (18 − 12)/2 = 3.", "optionExplanations": {"A": "Incorrect. x̄ is the midpoint, not the lower limit.", "B": "Incorrect. x̄ is the midpoint, not the upper limit.", "C": "Incorrect. 6 is the full width, not the margin.", "D": "Correct. A CI has the form x̄ ± margin, so it is symmetric about x̄. x̄ = (12 + 18)/2 = 15, and margin = (18 − 12)/2 = 3."}}, {"id": 10, "question": "A 95% CI for μ is (12, 18). Consider testing H₀: μ = 20 against H₁: μ ≠ 20 at α = 0.05. The conclusion is:", "options": {"A": "Reject H₀, since 20 lies inside the interval", "B": "Reject H₀, since 20 lies outside the interval", "C": "Fail to reject H₀, since 20 lies outside the interval", "D": "Nothing can be concluded"}, "correctAnswer": "B", "explanation": "A two-sided test at level α rejects H₀: μ = μ₀ exactly when μ₀ is outside the (1−α) CI. Since 20 is outside (12, 18), reject H₀ at the 5% level.", "optionExplanations": {"A": "Incorrect. 20 is not inside (12, 18).", "B": "Correct. A two-sided test at level α rejects H₀: μ = μ₀ exactly when μ₀ is outside the (1−α) CI. Since 20 is outside (12, 18), reject H₀ at the 5% level.", "C": "Incorrect. values outside the CI are not plausible, which leads to rejection.", "D": "Incorrect. the duality between tests and CIs gives a decision."}}]},
{"id": "quiz-11", "title": "Confidence Intervals for Two Means", "description": "Independent, pooled and paired intervals for differences of means.", "questions": [{"id": 1, "question": "Independent samples have known variances σ₁², σ₂². The standard error of X̄₁ − X̄₂ is:", "options": {"A": "√(σ₁²/n₁ − σ₂²/n₂)", "B": "σ₁²/n₁ + σ₂²/n₂", "C": "(σ₁ + σ₂)/√(n₁ + n₂)", "D": "√(σ₁²/n₁ + σ₂²/n₂)"}, "correctAnswer": "D", "explanation": "By independence Var(X̄₁ − X̄₂) = Var(X̄₁) + Var(X̄₂) = σ₁²/n₁ + σ₂²/n₂. The standard error is the square root. Variances add even for a difference.", "optionExplanations": {"A": "Incorrect. variances of independent variables never subtract.", "B": "Incorrect. this is the variance, not its square root.", "C": "Incorrect. this is not a valid combination.", "D": "Correct. By independence Var(X̄₁ − X̄₂) = Var(X̄₁) + Var(X̄₂) = σ₁²/n₁ + σ₂²/n₂. The standard error is the square root. Variances add even for a difference."}}, {"id": 2, "question": "X̄₁ = 52, X̄₂ = 48, σ₁² = 16, n₁ = 16, σ₂² = 25, n₂ = 25. The 95% CI for μ₁ − μ₂ is approximately:", "options": {"A": "(3.0, 5.0)", "B": "(1.23, 6.77)", "C": "(2.0, 6.0)", "D": "(−0.77, 8.77)"}, "correctAnswer": "B", "explanation": "Difference = 4. SE = √(16/16 + 25/25) = √2 ≈ 1.414. Margin = 1.96 × 1.414 ≈ 2.77. Interval = 4 ± 2.77 = (1.23, 6.77).", "optionExplanations": {"A": "Incorrect. this margin of 1 is just a fraction of the SE.", "B": "Correct. Difference = 4. SE = √(16/16 + 25/25) = √2 ≈ 1.414. Margin = 1.96 × 1.414 ≈ 2.77. Interval = 4 ± 2.77 = (1.23, 6.77).", "C": "Incorrect. this margin of 2 is too small.", "D": "Incorrect. this uses margin 4.77, which is too large."}}, {"id": 3, "question": "n₁ = 10, s₁² = 4; n₂ = 15, s₂² = 9. The pooled variance s_p² = [(n₁−1)s₁² + (n₂−1)s₂²]/(n₁+n₂−2) is:", "options": {"A": "6.5", "B": "13", "C": "7.04", "D": "6.0"}, "correctAnswer": "C", "explanation": "Numerator: (9)(4) + (14)(9) = 36 + 126 = 162. Denominator: 10 + 15 − 2 = 23. s_p² = 162/23 ≈ 7.04. It is a weighted average of the sample variances.", "optionExplanations": {"A": "Incorrect. 6.5 is the unweighted average of 4 and 9.", "B": "Incorrect. 13 is the sum of the variances.", "C": "Correct. Numerator: (9)(4) + (14)(9) = 36 + 126 = 162. Denominator: 10 + 15 − 2 = 23. s_p² = 162/23 ≈ 7.04. It is a weighted average of the sample variances.", "D": "Incorrect. 6.0 does not follow from the formula."}}, {"id": 4, "question": "The pooled two-sample t procedure (equal variances, independent normal samples) uses how many degrees of freedom?", "options": {"A": "n₁ + n₂ − 2", "B": "n₁ + n₂ − 1", "C": "n₁ − 1", "D": "n₁ + n₂"}, "correctAnswer": "A", "explanation": "Two means are estimated (one per sample), so two degrees of freedom are lost from the n₁ + n₂ observations: df = n₁ + n₂ − 2.", "optionExplanations": {"A": "Correct. Two means are estimated (one per sample), so two degrees of freedom are lost from the n₁ + n₂ observations: df = n₁ + n₂ − 2.", "B": "Incorrect. only one parameter would be estimated for this df.", "C": "Incorrect. this is the df for a single sample.", "D": "Incorrect. no parameters are estimated for this df."}}, {"id": 5, "question": "n₁ = n₂ = 9, s₁² = 6, s₂² = 10, X̄₁ − X̄₂ = 5. With t(0.025, 16) = 2.120, the pooled 95% CI for μ₁ − μ₂ is approximately:", "options": {"A": "(4.33, 5.67)", "B": "(0.0, 10.0)", "C": "(2.17, 7.83)", "D": "(−0.6, 10.6)"}, "correctAnswer": "C", "explanation": "s_p² = (8×6 + 8×10)/16 = 8. SE = s_p√(1/9 + 1/9) = √8 × √(2/9) = √(16/9) = 4/3. Margin = 2.120 × 4/3 ≈ 2.83. Interval = 5 ± 2.83 = (2.17, 7.83).", "optionExplanations": {"A": "Incorrect. this margin is only about 0.67, close to a single SE.", "B": "Incorrect. this margin of 5 is too large.", "C": "Correct. s_p² = (8×6 + 8×10)/16 = 8. SE = s_p√(1/9 + 1/9) = √8 × √(2/9) = √(16/9) = 4/3. Margin = 2.120 × 4/3 ≈ 2.83. Interval = 5 ± 2.83 = (2.17, 7.83).", "D": "Incorrect. this margin of 5.6 is too large."}}, {"id": 6, "question": "A 95% CI for μ₁ − μ₂ is (−1.2, 3.4). The most appropriate conclusion is:", "options": {"A": "The interval is invalid because it includes a negative value", "B": "There is no significant difference at the 5% level since 0 is in the interval", "C": "μ₁ is definitely larger than μ₂", "D": "μ₁ = μ₂ is proven"}, "correctAnswer": "B", "explanation": "Zero is a plausible value for the difference, so the data do not give evidence of a difference at the 5% level. This does not prove equality; it only means we cannot rule it out.", "optionExplanations": {"A": "Incorrect. negative limits are fine for a difference.", "B": "Correct. Zero is a plausible value for the difference, so the data do not give evidence of a difference at the 5% level. This does not prove equality; it only means we cannot rule it out.", "C": "Incorrect. the interval allows μ₁ − μ₂ to be negative.", "D": "Incorrect. failing to find a difference never proves equality."}}, {"id": 7, "question": "A 95% CI for μ₁ − μ₂ is (2.1, 5.9). We conclude:", "options": {"A": "The test is inconclusive because the interval is wide", "B": "μ₂ is greater than μ₁", "C": "No difference exists", "D": "μ₁ is greater than μ₂ (significant at the 5% level)"}, "correctAnswer": "D", "explanation": "Every value in the interval is positive, so 0 is excluded. Hence μ₁ − μ₂ > 0 with 95% confidence, which corresponds to a significant difference at 5%.", "optionExplanations": {"A": "Incorrect. width affects precision, not this conclusion.", "B": "Incorrect. the interval is entirely positive, not negative.", "C": "Incorrect. 0 is outside the interval, so a difference is supported.", "D": "Correct. Every value in the interval is positive, so 0 is excluded. Hence μ₁ − μ₂ > 0 with 95% confidence, which corresponds to a significant difference at 5%."}}, {"id": 8, "question": "Paired differences are 3, 5, 4, 6, 2. The standard error of the mean difference is s_d/√n where s_d is the sample standard deviation of the differences. It equals approximately:", "options": {"A": "0.707", "B": "1.581", "C": "2.5", "D": "0.5"}, "correctAnswer": "A", "explanation": "d̄ = 20/5 = 4. Deviations: −1, 1, 0, 2, −2, so Σ = 10 and s_d² = 10/4 = 2.5 (s_d ≈ 1.581). SE = s_d/√5 = √(2.5/5) = √0.5 ≈ 0.707.", "optionExplanations": {"A": "Correct. d̄ = 20/5 = 4. Deviations: −1, 1, 0, 2, −2, so Σ = 10 and s_d² = 10/4 = 2.5 (s_d ≈ 1.581). SE = s_d/√5 = √(2.5/5) = √0.5 ≈ 0.707.", "B": "Incorrect. 1.581 is s_d, not divided by √n.", "C": "Incorrect. 2.5 is the variance s_d².", "D": "Incorrect. 0.5 is the variance of the mean, not its standard error."}}, {"id": 9, "question": "Blood pressure is measured on the same 20 patients before and after treatment. The appropriate CI for the mean change is:", "options": {"A": "A paired (one-sample on differences) t interval with 19 df", "B": "A chi-square interval", "C": "A pooled two-sample t interval with 38 df", "D": "A z interval for proportions"}, "correctAnswer": "A", "explanation": "The two measurements on the same patient are dependent, so we analyse the 20 differences dᵢ. This is a one-sample t procedure with n − 1 = 19 df.", "optionExplanations": {"A": "Correct. The two measurements on the same patient are dependent, so we analyse the 20 differences dᵢ. This is a one-sample t procedure with n − 1 = 19 df.", "B": "Incorrect. the mean change is not a variance problem.", "C": "Incorrect. that would treat the samples as independent.", "D": "Incorrect. blood pressure is not a proportion."}}, {"id": 10, "question": "Increasing both sample sizes n₁ and n₂ (everything else the same) makes the CI for μ₁ − μ₂:", "options": {"A": "Shifted", "B": "Narrower", "C": "Wider", "D": "Unchanged"}, "correctAnswer": "B", "explanation": "SE = √(σ₁²/n₁ + σ₂²/n₂) decreases as n₁ and n₂ grow, so the margin of error shrinks and the interval is narrower, i.e. more precise.", "optionExplanations": {"A": "Incorrect. the centre depends on the data, not on n.", "B": "Correct. SE = √(σ₁²/n₁ + σ₂²/n₂) decreases as n₁ and n₂ grow, so the margin of error shrinks and the interval is narrower, i.e. more precise.", "C": "Incorrect. the SE shrinks with n.", "D": "Incorrect. the margin depends on the SE."}}]},
{"id": "quiz-12", "title": "Hypothesis Testing", "description": "Errors, test statistics, p-values and decisions.", "questions": [{"id": 1, "question": "A Type I error occurs when we:", "options": {"A": "Fail to reject H₀ when H₀ is false", "B": "Reject H₀ when H₀ is false", "C": "Reject H₀ when H₀ is true", "D": "Accept H₁ with probability 1"}, "correctAnswer": "C", "explanation": "A Type I error is a false positive: rejecting a true null hypothesis. Its probability is the significance level α, which the researcher chooses in advance.", "optionExplanations": {"A": "Incorrect. that is a Type II error (probability β).", "B": "Incorrect. rejecting a false H₀ is a correct decision (probability 1 − β, the power).", "C": "Correct. A Type I error is a false positive: rejecting a true null hypothesis. Its probability is the significance level α, which the researcher chooses in advance.", "D": "Incorrect. no test guarantees acceptance of H₁."}}, {"id": 2, "question": "The power of a test is:", "options": {"A": "β", "B": "α", "C": "1 − α", "D": "1 − β, the probability of rejecting H₀ when H₁ is true"}, "correctAnswer": "D", "explanation": "β = P(fail to reject H₀ | H₁ true). The power is the complement, 1 − β = P(reject H₀ | H₁ true): the chance of detecting a real effect.", "optionExplanations": {"A": "Incorrect. β is the Type II error probability.", "B": "Incorrect. α is the Type I error probability.", "C": "Incorrect. 1 − α is the probability of correctly not rejecting a true H₀.", "D": "Correct. β = P(fail to reject H₀ | H₁ true). The power is the complement, 1 − β = P(reject H₀ | H₁ true): the chance of detecting a real effect."}}, {"id": 3, "question": "H₀: μ = 100, σ = 10 known, n = 25, x̄ = 104. The test statistic z = (x̄ − μ₀)/(σ/√n) is:", "options": {"A": "4", "B": "2", "C": "0.4", "D": "20"}, "correctAnswer": "B", "explanation": "Given: x̄ − μ₀ = 4. Standard error σ/√n = 10/5 = 2. z = 4/2 = 2.", "optionExplanations": {"A": "Incorrect. 4 is the raw difference, not divided by the SE.", "B": "Correct. Given: x̄ − μ₀ = 4. Standard error σ/√n = 10/5 = 2. z = 4/2 = 2.", "C": "Incorrect. 0.4 uses σ/√n = 10 instead of 2.", "D": "Incorrect. 20 multiplies instead of dividing."}}, {"id": 4, "question": "With z = 2 for a two-sided test of H₀: μ = μ₀ at α = 0.05 (critical values ±1.96), the decision is:", "options": {"A": "Reject H₀", "B": "Fail to reject H₀", "C": "Increase α", "D": "Accept H₁ with certainty"}, "correctAnswer": "A", "explanation": "Reject H₀ if |z| > 1.96. Here |z| = 2 > 1.96, so z lies in the rejection region and H₀ is rejected at the 5% level.", "optionExplanations": {"A": "Correct. Reject H₀ if |z| > 1.96. Here |z| = 2 > 1.96, so z lies in the rejection region and H₀ is rejected at the 5% level.", "B": "Incorrect. 2 exceeds 1.96.", "C": "Incorrect. changing α after seeing the result invalidates the test.", "D": "Incorrect. |z| is beyond the critical value."}}, {"id": 5, "question": "For z = 2 in a two-sided test (P(Z > 2) = 0.0228), the p-value is:", "options": {"A": "0.0455", "B": "0.05", "C": "0.9772", "D": "0.0228"}, "correctAnswer": "A", "explanation": "Two-sided p-value = P(|Z| ≥ 2) = 2 × P(Z ≥ 2) = 2 × 0.0228 = 0.0456 (≈ 0.0455 with more decimals).", "optionExplanations": {"A": "Correct. Two-sided p-value = P(|Z| ≥ 2) = 2 × P(Z ≥ 2) = 2 × 0.0228 = 0.0456 (≈ 0.0455 with more decimals).", "B": "Incorrect. 0.05 is the significance level, not the p-value.", "C": "Incorrect. 0.9772 is P(Z < 2).", "D": "Incorrect. 0.0228 is the one-sided p-value."}}, {"id": 6, "question": "The correct meaning of a p-value is:", "options": {"A": "The probability that the result occurred by chance only", "B": "The probability of results at least as extreme as observed, assuming H₀ is true", "C": "The probability that H₀ is true", "D": "The probability of a Type II error"}, "correctAnswer": "B", "explanation": "A p-value is computed under the assumption that H₀ is true: p = P(test statistic at least as extreme as observed | H₀). It is not the probability that H₀ itself is true.", "optionExplanations": {"A": "Incorrect. it is conditional on H₀, not a statement about chance alone.", "B": "Correct. A p-value is computed under the assumption that H₀ is true: p = P(test statistic at least as extreme as observed | H₀). It is not the probability that H₀ itself is true.", "C": "Incorrect. H₀ is not a random event in the classical framework.", "D": "Incorrect. β is unrelated to the p-value."}}, {"id": 7, "question": "A test gives p = 0.08 with α = 0.05. The correct conclusion is:", "options": {"A": "H₁ is false", "B": "Reject H₀", "C": "H₀ is true", "D": "Fail to reject H₀; there is insufficient evidence at the 5% level"}, "correctAnswer": "D", "explanation": "Reject only if p ≤ α. Here 0.08 > 0.05, so we fail to reject H₀. This means the data lack sufficient evidence against H₀; it does not prove H₀ true.", "optionExplanations": {"A": "Incorrect. lack of evidence does not prove H₁ false.", "B": "Incorrect. 0.08 is greater than α.", "C": "Incorrect. failing to reject does not establish H₀.", "D": "Correct. Reject only if p ≤ α. Here 0.08 > 0.05, so we fail to reject H₀. This means the data lack sufficient evidence against H₀; it does not prove H₀ true."}}, {"id": 8, "question": "For a fixed sample size, decreasing α from 0.05 to 0.01 makes:", "options": {"A": "β larger (power smaller)", "B": "β smaller", "C": "No change in β", "D": "Power larger"}, "correctAnswer": "A", "explanation": "A smaller α shrinks the rejection region, making it harder to reject H₀. Therefore a false H₀ is missed more often: β rises and power falls. For a fixed n the two error types trade off.", "optionExplanations": {"A": "Correct. A smaller α shrinks the rejection region, making it harder to reject H₀. Therefore a false H₀ is missed more often: β rises and power falls. For a fixed n the two error types trade off.", "B": "Incorrect. a harder rejection standard increases β.", "C": "Incorrect. β changes as the rejection region changes.", "D": "Incorrect. power falls when it is harder to reject."}}, {"id": 9, "question": "Holding α and the true effect size fixed, which change increases the power of a z-test?", "options": {"A": "Decreasing n", "B": "Increasing σ", "C": "Increasing the sample size n", "D": "Decreasing the effect size"}, "correctAnswer": "C", "explanation": "The test statistic's standard error σ/√n shrinks as n grows, so a given true difference gives a larger z and rejection is more likely: power increases.", "optionExplanations": {"A": "Incorrect. fewer observations reduce power.", "B": "Incorrect. more variability makes a true effect harder to detect.", "C": "Correct. The test statistic's standard error σ/√n shrinks as n grows, so a given true difference gives a larger z and rejection is more likely: power increases.", "D": "Incorrect. smaller effects are harder to detect."}}, {"id": 10, "question": "H₀: μ = μ₀ against H₁: μ > μ₀ with σ known, α = 0.05 (one-sided critical value 1.645), and z = 1.80. The decision is:", "options": {"A": "The test is invalid", "B": "Reject H₀", "C": "Reject only if the test were two-sided", "D": "Fail to reject H₀"}, "correctAnswer": "B", "explanation": "For H₁: μ > μ₀ reject when z > 1.645. Since 1.80 > 1.645, reject H₀. (For a two-sided 5% test the cutoff would be 1.96 and 1.80 would not be significant, so the choice of H₁ must be made before the data.)", "optionExplanations": {"A": "Incorrect. the test is valid.", "B": "Correct. For H₁: μ > μ₀ reject when z > 1.645. Since 1.80 > 1.645, reject H₀. (For a two-sided 5% test the cutoff would be 1.96 and 1.80 would not be significant, so the choice of H₁ must be made before the data.)", "C": "Incorrect. the two-sided cutoff 1.96 would lead to non-rejection, not rejection.", "D": "Incorrect. z lies in the rejection region."}}]},
{"id": "quiz-13", "title": "Likelihood Ratio Tests", "description": "Likelihood ratio Λ, Wilks' theorem and examples.", "questions": [{"id": 1, "question": "The likelihood ratio statistic for H₀: θ ∈ Θ₀ is Λ = sup_{θ∈Θ₀} L(θ) / sup_{θ∈Θ} L(θ). Which statement is correct?", "options": {"A": "Λ can be negative", "B": "0 ≤ Λ ≤ 1", "C": "Λ is always exactly 0.5", "D": "Λ ≥ 1 always"}, "correctAnswer": "B", "explanation": "The numerator maximises L over a subset Θ₀ of the full parameter space, so it cannot exceed the denominator. Since likelihoods are non-negative, 0 ≤ Λ ≤ 1.", "optionExplanations": {"A": "Incorrect. likelihoods are non-negative.", "B": "Correct. The numerator maximises L over a subset Θ₀ of the full parameter space, so it cannot exceed the denominator. Since likelihoods are non-negative, 0 ≤ Λ ≤ 1.", "C": "Incorrect. Λ is not constant.", "D": "Incorrect. a maximum over a subset cannot beat the maximum over the whole space."}}, {"id": 2, "question": "A likelihood ratio test rejects H₀ when:", "options": {"A": "Λ = 1 exactly", "B": "Λ is small", "C": "Λ is large", "D": "Λ is close to 1"}, "correctAnswer": "B", "explanation": "A small Λ means the best fit under H₀ is much worse than the unrestricted best fit, which is evidence against H₀. We reject when Λ ≤ c, where c is chosen to give size α.", "optionExplanations": {"A": "Incorrect. Λ = 1 means no evidence against H₀.", "B": "Correct. A small Λ means the best fit under H₀ is much worse than the unrestricted best fit, which is evidence against H₀. We reject when Λ ≤ c, where c is chosen to give size α.", "C": "Incorrect. a large Λ means H₀ fits well.", "D": "Incorrect. Λ near 1 means H₀ fits almost as well as the best model."}}, {"id": 3, "question": "A normal sample with σ = 2, n = 25 has x̄ = 5.6. For H₀: μ = 5, −2 ln Λ = n(x̄ − μ₀)²/σ². Its value is:", "options": {"A": "9", "B": "2.25", "C": "0.36", "D": "1.5"}, "correctAnswer": "B", "explanation": "Substitute: n(x̄ − μ₀)²/σ² = 25 × 0.6²/4 = 25 × 0.36/4 = 2.25. This equals z², where z = 0.6/(2/5) = 1.5.", "optionExplanations": {"A": "Incorrect. 9 comes from 25 × 0.36 without dividing by σ² = 4.", "B": "Correct. Substitute: n(x̄ − μ₀)²/σ² = 25 × 0.6²/4 = 25 × 0.36/4 = 2.25. This equals z², where z = 0.6/(2/5) = 1.5.", "C": "Incorrect. 0.36 omits n and σ².", "D": "Incorrect. 1.5 is z, not z²."}}, {"id": 4, "question": "A model has 3 free parameters. H₀ fixes 2 of them. For large n, −2 ln Λ is approximately χ² with how many degrees of freedom (Wilks' theorem)?", "options": {"A": "3", "B": "1", "C": "5", "D": "2"}, "correctAnswer": "D", "explanation": "Degrees of freedom = (free parameters in the full model) − (free parameters under H₀) = 3 − 1 = 2, i.e. the number of restrictions imposed by H₀.", "optionExplanations": {"A": "Incorrect. 3 is the full model size, not the difference.", "B": "Incorrect. 1 is the number of free parameters left under H₀.", "C": "Incorrect. 5 adds numbers that have no role.", "D": "Correct. Degrees of freedom = (free parameters in the full model) − (free parameters under H₀) = 3 − 1 = 2, i.e. the number of restrictions imposed by H₀."}}, {"id": 5, "question": "For a one-parameter problem (df = 1), −2 ln Λ = 5.2. The χ² critical value at α = 0.05 is 3.841. The decision is:", "options": {"A": "Reject H₀", "B": "Cannot decide", "C": "Accept H₀ as true", "D": "Fail to reject H₀"}, "correctAnswer": "A", "explanation": "Reject H₀ when −2 ln Λ exceeds the critical value. 5.2 > 3.841, so reject at the 5% level.", "optionExplanations": {"A": "Correct. Reject H₀ when −2 ln Λ exceeds the critical value. 5.2 > 3.841, so reject at the 5% level.", "B": "Incorrect. the statistic can be compared to the critical value directly.", "C": "Incorrect. rejection is the correct decision.", "D": "Incorrect. 5.2 exceeds 3.841."}}, {"id": 6, "question": "In 10 Bernoulli trials there are 7 successes. For H₀: p = 0.5, with Λ = L(0.5)/L(p̂) where p̂ = 0.7, Λ is approximately:", "options": {"A": "0.70", "B": "0.50", "C": "0.44", "D": "2.28"}, "correctAnswer": "C", "explanation": "L(p) ∝ p⁷(1−p)³. L(0.5) = 0.5¹⁰ ≈ 0.000977. L(0.7) = 0.7⁷ × 0.3³ = 0.08235 × 0.027 ≈ 0.002224. Λ = 0.000977/0.002224 ≈ 0.44.", "optionExplanations": {"A": "Incorrect. 0.70 is p̂, not the ratio.", "B": "Incorrect. 0.50 is p₀.", "C": "Correct. L(p) ∝ p⁷(1−p)³. L(0.5) = 0.5¹⁰ ≈ 0.000977. L(0.7) = 0.7⁷ × 0.3³ = 0.08235 × 0.027 ≈ 0.002224. Λ = 0.000977/0.002224 ≈ 0.44.", "D": "Incorrect. 2.28 is the inverse ratio, which would exceed 1."}}, {"id": 7, "question": "Poisson(λ), n = 1, x = 2, H₀: λ = 1. With λ̂ = 2, Λ = L(1)/L(2) is:", "options": {"A": "e/4 ≈ 0.68", "B": "4/e ≈ 1.47", "C": "e^(−1) ≈ 0.37", "D": "0.25"}, "correctAnswer": "A", "explanation": "L(λ) ∝ e^(−λ)λ². L(1) = e^(−1). L(2) = 4e^(−2). Λ = e^(−1)/(4e^(−2)) = e/4 ≈ 0.68.", "optionExplanations": {"A": "Correct. L(λ) ∝ e^(−λ)λ². L(1) = e^(−1). L(2) = 4e^(−2). Λ = e^(−1)/(4e^(−2)) = e/4 ≈ 0.68.", "B": "Incorrect. 4/e is the inverse and exceeds 1.", "C": "Incorrect. e^(−1) is the numerator alone.", "D": "Incorrect. 0.25 ignores the exponential terms."}}, {"id": 8, "question": "For a normal sample with σ unknown, the likelihood ratio test of H₀: μ = μ₀ is equivalent to:", "options": {"A": "The z test with known σ", "B": "The Mann–Whitney test", "C": "The one-sample t test", "D": "A chi-square test for σ²"}, "correctAnswer": "C", "explanation": "After maximising over σ² both under H₀ and unrestricted, Λ is a decreasing function of |t| where t = (x̄ − μ₀)/(s/√n). So rejecting for small Λ is the same as rejecting for large |t|.", "optionExplanations": {"A": "Incorrect. σ is unknown, so s replaces it.", "B": "Incorrect. the LRT here is parametric.", "C": "Correct. After maximising over σ² both under H₀ and unrestricted, Λ is a decreasing function of |t| where t = (x̄ − μ₀)/(s/√n). So rejecting for small Λ is the same as rejecting for large |t|.", "D": "Incorrect. the test concerns μ, not σ²."}}, {"id": 9, "question": "For a particular data set Λ = 1. What does this tell us?", "options": {"A": "The H₀ value fits as well as the MLE, so there is no evidence against H₀", "B": "The MLE is undefined", "C": "H₀ must be rejected", "D": "The data are invalid"}, "correctAnswer": "A", "explanation": "Λ = 1 means the restricted maximum equals the unrestricted maximum: the data are as likely under H₀ as under the best parameter value. The statistic gives no evidence against H₀.", "optionExplanations": {"A": "Correct. Λ = 1 means the restricted maximum equals the unrestricted maximum: the data are as likely under H₀ as under the best parameter value. The statistic gives no evidence against H₀.", "B": "Incorrect. the MLE exists.", "C": "Incorrect. rejection needs small Λ.", "D": "Incorrect. Λ = 1 is a valid outcome."}}, {"id": 10, "question": "For a simple H₀: θ = θ₀ against a simple H₁: θ = θ₁, rejecting for small Λ is equivalent to rejecting for:", "options": {"A": "Large x̄ always", "B": "Small variance", "C": "Large L(θ₀)/L(θ₁)", "D": "Small L(θ₀)/L(θ₁), the Neyman–Pearson test"}, "correctAnswer": "D", "explanation": "With only two parameter values the unrestricted maximum is max{L(θ₀), L(θ₁)}, so Λ = L(θ₀)/max{L(θ₀), L(θ₁)}. Λ is small exactly when L(θ₀)/L(θ₁) is small, which is the Neyman–Pearson rejection rule.", "optionExplanations": {"A": "Incorrect. the direction depends on the model, not always x̄.", "B": "Incorrect. variance is not the criterion.", "C": "Incorrect. a large ratio supports H₀, not H₁.", "D": "Correct. With only two parameter values the unrestricted maximum is max{L(θ₀), L(θ₁)}, so Λ = L(θ₀)/max{L(θ₀), L(θ₁)}. Λ is small exactly when L(θ₀)/L(θ₁) is small, which is the Neyman–Pearson rejection rule."}}]},
{"id": "quiz-14", "title": "Neyman–Pearson Lemma", "description": "Most powerful tests, rejection regions, size and power.", "questions": [{"id": 1, "question": "The Neyman–Pearson lemma concerns testing H₀: θ = θ₀ against H₁: θ = θ₁. The most powerful test of size α rejects H₀ when:", "options": {"A": "L(θ₀)/L(θ₁) ≥ k for any k", "B": "L(θ₀)/L(θ₁) ≤ k, with k chosen so that the size is α", "C": "The p-value exceeds α", "D": "x̄ is large, always"}, "correctAnswer": "B", "explanation": "The lemma says the best critical region contains the sample points where the likelihood under H₀ is small relative to that under H₁: L(θ₀)/L(θ₁) ≤ k. The constant k is fixed by requiring P(reject | H₀) = α.", "optionExplanations": {"A": "Incorrect. rejecting for large ratios would favour H₀.", "B": "Correct. The lemma says the best critical region contains the sample points where the likelihood under H₀ is small relative to that under H₁: L(θ₀)/L(θ₁) ≤ k. The constant k is fixed by requiring P(reject | H₀) = α.", "C": "Incorrect. a p-value above α leads to non-rejection.", "D": "Incorrect. the direction of the rejection region depends on the model."}}, {"id": 2, "question": "\"Most powerful test of size α\" means:", "options": {"A": "It has the smallest Type I error of all tests", "B": "Among all tests with size at most α, it has the greatest power at θ₁", "C": "It has β = 0", "D": "Its power equals α"}, "correctAnswer": "B", "explanation": "Size is the Type I error probability. Among all tests whose size does not exceed α, the NP test maximises P(reject | θ₁) = 1 − β, so it has the smallest Type II error.", "optionExplanations": {"A": "Incorrect. Type I error is fixed at α, not minimised.", "B": "Correct. Size is the Type I error probability. Among all tests whose size does not exceed α, the NP test maximises P(reject | θ₁) = 1 − β, so it has the smallest Type II error.", "C": "Incorrect. β = 0 is not achievable in general.", "D": "Incorrect. power exceeds α for a sensible test."}}, {"id": 3, "question": "X₁,…,Xₙ ~ N(μ, σ²) with σ² known. For H₀: μ = μ₀ against H₁: μ = μ₁ with μ₁ > μ₀, the NP test rejects for:", "options": {"A": "Small values of X̄", "B": "Values of X̄ near μ₀", "C": "Large values of X̄", "D": "Large values of S²"}, "correctAnswer": "C", "explanation": "L(μ₀)/L(μ₁) = exp{−(n/(2σ²))[(x̄−μ₀)² − (x̄−μ₁)²]}. The remaining terms cancel exactly. Because μ₁ > μ₀ the ratio decreases as x̄ increases, so the ratio is small (evidence for H₁) when x̄ is large.", "optionExplanations": {"A": "Incorrect. small x̄ favours μ₀ when μ₁ > μ₀.", "B": "Incorrect. values near μ₀ support H₀.", "C": "Correct. L(μ₀)/L(μ₁) = exp{−(n/(2σ²))[(x̄−μ₀)² − (x̄−μ₁)²]}. The remaining terms cancel exactly. Because μ₁ > μ₀ the ratio decreases as x̄ increases, so the ratio is small (evidence for H₁) when x̄ is large.", "D": "Incorrect. σ² is known; S² plays no role."}}, {"id": 4, "question": "μ₀ = 50, σ = 10, n = 25, α = 0.05, H₁: μ > 50 (z₀.₀₅ = 1.645). The NP test rejects when X̄ exceeds:", "options": {"A": "53.29", "B": "58.20", "C": "50", "D": "51.65"}, "correctAnswer": "A", "explanation": "Under H₀, X̄ ~ N(50, (10/5)²) = N(50, 2²). We need P(X̄ > c) = 0.05, so c = 50 + 1.645 × 2 = 53.29.", "optionExplanations": {"A": "Correct. Under H₀, X̄ ~ N(50, (10/5)²) = N(50, 2²). We need P(X̄ > c) = 0.05, so c = 50 + 1.645 × 2 = 53.29.", "B": "Incorrect. 58.2 comes from using a standard error of 5 instead of σ/√n = 2.", "C": "Incorrect. 50 would give size 0.5.", "D": "Incorrect. 51.65 adds 1.645 without multiplying by the SE."}}, {"id": 5, "question": "Continuing: reject if X̄ > 53.29. Find the power at μ₁ = 54 (SE = 2). It is approximately:", "options": {"A": "0.36", "B": "0.95", "C": "0.05", "D": "0.64"}, "correctAnswer": "D", "explanation": "Power = P(X̄ > 53.29 | μ = 54) = P(Z > (53.29 − 54)/2) = P(Z > −0.355) = Φ(0.355) ≈ 0.64.", "optionExplanations": {"A": "Incorrect. 0.36 is β = 1 − power.", "B": "Incorrect. 0.95 is not obtained from this calculation.", "C": "Incorrect. 0.05 is the size α, the rejection probability under H₀.", "D": "Correct. Power = P(X̄ > 53.29 | μ = 54) = P(Z > (53.29 − 54)/2) = P(Z > −0.355) = Φ(0.355) ≈ 0.64."}}, {"id": 6, "question": "A sample from f(x;λ) = λe^(−λx), x > 0. For H₀: λ = λ₀ against H₁: λ = λ₁ with λ₁ > λ₀, the NP test rejects when:", "options": {"A": "X₁ alone is large", "B": "ΣXᵢ is small", "C": "max(Xᵢ) is large", "D": "ΣXᵢ is large"}, "correctAnswer": "B", "explanation": "L(λ₀)/L(λ₁) = (λ₀/λ₁)ⁿ exp{(λ₁ − λ₀)ΣXᵢ}. Since λ₁ > λ₀ this ratio increases with ΣXᵢ, so it is small when ΣXᵢ is small. Larger λ means shorter lifetimes, so small totals support H₁.", "optionExplanations": {"A": "Incorrect. the sufficient statistic ΣXᵢ is used, not one observation.", "B": "Correct. L(λ₀)/L(λ₁) = (λ₀/λ₁)ⁿ exp{(λ₁ − λ₀)ΣXᵢ}. Since λ₁ > λ₀ this ratio increases with ΣXᵢ, so it is small when ΣXᵢ is small. Larger λ means shorter lifetimes, so small totals support H₁.", "C": "Incorrect. the maximum is not the sufficient statistic.", "D": "Incorrect. large totals make the ratio large, favouring H₀."}}, {"id": 7, "question": "For Bernoulli data with H₀: p = 0.5 and H₁: p = 0.7, the ratio L(p₀)/L(p₁) is proportional to (3/7)^s where s = ΣXᵢ. The NP test rejects when:", "options": {"A": "s is small", "B": "s is odd", "C": "s is large", "D": "s equals n/2"}, "correctAnswer": "C", "explanation": "Since 3/7 < 1, (3/7)^s decreases as s rises, so the ratio is small when s is large. Many successes support p = 0.7.", "optionExplanations": {"A": "Incorrect. small s makes the ratio large.", "B": "Incorrect. parity has no role.", "C": "Correct. Since 3/7 < 1, (3/7)^s decreases as s rises, so the ratio is small when s is large. Many successes support p = 0.7.", "D": "Incorrect. s = n/2 is typical under H₀."}}, {"id": 8, "question": "n = 3 Bernoulli trials, H₀: p = 0.5. The test rejects H₀ only when all three trials are successes (ΣXᵢ = 3). Its size is:", "options": {"A": "0.375", "B": "0.5", "C": "0.875", "D": "0.125"}, " ": "Incorrect. the two-sided alternative has no UMP test.", "C": "Incorrect. there is no restriction to n = 1.", "D": "Incorrect. it has power above α for every μ₁ > μ₀."}}]},

ct. 16 forgets to divide by 2.", "Incorrect. 4 is the difference, not squared or halved.", "Incorrect. 2 is 4/2, which forgets to square."]], "quiz-3": [["Incorrect. The bias is −θ/(n+1) ≠ 0 for every n.", "Correct. Bias is nonzero for each n, but bias and variance both → 0.", "Incorrect. Bias and variance → 0, so Tₙ is consistent.", "Incorrect. Tₙ is biased and consistent."], ["Incorrect. The bias is 1/n, so it is not unbiased.", "Incorrect. MSE = 1/n² + σ²/n → 0, so it is consistent.", "Correct. Bias 1/n → 0 and variance σ²/n → 0.", "Incorrect. It is biased and consistent."], ["Incorrect. Unbiasedness alone does not give consistency.", "Correct. E(X₁) = μ but Var(X₁) = σ² never shrinks.", "Incorrect. Tₙ is unbiased.", "Incorrect. Tₙ is unbiased."], ["Correct. E(X̄²) = μ² + σ²/n is biased, yet X̄² → μ² in probability.", "Incorrect. E(X̄²) = μ² + σ²/n, so it is biased.", "Incorrect. Continuous mapping makes X̄² consistent.", "Incorrect. It is biased and consistent."], ["Correct. Bias 0 and variance 1/√n → 0 give MSE → 0.", "Incorrect. Consistency does not need a 1/n rate.", "Incorrect. It is stated to be unbiased.", "Incorrect. It is well defined for every n."], ["Incorrect. The LLN needs a finite mean, which Cauchy lacks.", "Correct. X̄ₙ has the same Cauchy distribution for every n.", "Incorrect. Cauchy has no finite variance.", "Incorrect. X̄ₙ is not consistent."], ["Correct. E(S²) = σ² and Var(S²) → 0 with a finite fourth moment.", "Incorrect. S² is unbiased.", "Incorrect. Its variance → 0, so it is consistent.", "Incorrect. S² is unbiased, not biased."], ["Incorrect. The bias is ±1 and never → 0.", "Correct. The bias alternates between +1 and −1.", "Incorrect. E(Tₙ) = μ + (−1)ⁿ ≠ μ.", "Incorrect. MSE ≥ 1 for every n."], ["Correct. The median converges in probability to μ.", "Incorrect. The median is unbiased by symmetry, and bias is not the issue.", "Incorrect. Consistency does not depend on n being even.", "Incorrect. Its variance is of order 1/n → 0."], ["Corr
