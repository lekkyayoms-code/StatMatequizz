/* =====================================================================
   3. QUIZ ENGINE (do not edit to add content)
   ===================================================================== */
const $ = s => document.querySelector(s), app = $("#app");
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const ICON = {
  logo:"M3 20h18M6 16V9m6 7V5m6 11v-6", home:"M3 11l9-8 9 8M5 10v10h14V10", grid:"M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z",
  play:"M6 4l14 8-14 8z", lock:"M6 11h12v9H6zM8 11V8a4 4 0 018 0v3", check:"M5 13l4 4L19 7", x:"M6 6l12 12M18 6L6 18",
  left:"M15 5l-7 7 7 7", right:"M9 5l7 7-7 7", redo:"M3 12a9 9 0 109-9M3 4v5h5", star:"M12 3l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.8 6.1 21l1.2-6.5L2.5 9.9 9.1 9z", send:"M4 12l16-8-6 16-3-7z", clock:"M12 7v5l3 2M21 12a9 9 0 11-18 0 9 9 0 0118 0z", flag:"M5 21V4m0 0h11l-2 4 2 4H5"
};
const icon = n => `<svg class="i" viewBox="0 0 24 24"><path d="${ICON[n]}"/></svg>`;

/* Maths renderer: converts mini-notation to HTML (innermost-first, so nesting works) */
function M(s){
  let t = esc(s), p;
  do { p = t;
    t = t.replace(/\{frac:([^{}|]*)\|([^{}]*)\}/g,'<span class="frac"><span>$1</span><span>$2</span></span>')
         .replace(/\{sqrt:([^{}]*)\}/g,'<span class="sqrt">&radic;<span>$1</span></span>')
         .replace(/\{sum:([^{}|]*)\|([^{}]*)\}/g,'<span class="sum"><span>$2</span><b>&Sigma;</b><span>$1</span></span>')
         .replace(/\{bar:([^{}]*)\}/g,'$1&#772;').replace(/\{hat:([^{}]*)\}/g,'$1&#770;')
         .replace(/\^\{([^{}]*)\}/g,'<sup>$1</sup>').replace(/_\{([^{}]*)\}/g,'<sub>$1</sub>');
  } while (t !== p);
  return `<span class="m">${t}</span>`;
}

/* Storage */
let DB; try { DB = JSON.parse(localStorage.getItem(CONFIG.storageKey)) || {}; } catch(e){ DB = {}; }
DB.progress = DB.progress && typeof DB.progress === "object" ? DB.progress : {}; DB.drafts = DB.drafts && typeof DB.drafts === "object" ? DB.drafts : {};
const save = () => { try { localStorage.setItem(CONFIG.storageKey, JSON.stringify(DB)); } catch(e){} };

/* Quiz helpers */
const QUIZZES = QUIZ_BANK.filter(q => {
  const ok = q.questions && q.questions.length === CONFIG.questionsPerQuiz && q.questions.every(x => x.options && Object.keys(x.options).length === 4 && ["A","B","C","D"].every(k => typeof x.options[k] === "string") && ["A","B","C","D"].includes(x.correctAnswer) && typeof x.explanation === "string" && x.explanation.length > 0);
  if (!ok) console.warn(`Quiz "${q.id}" skipped: needs exactly ${CONFIG.questionsPerQuiz} questions.`);
  return ok;
});
const getQuiz = id => (V.vq && V.vq.id === id) ? V.vq : QUIZZES.find(q => q.id === id);
const isDone = q => !!DB.progress[q.id];
function status(q, i){
  if (isDone(q)) return "done";
  if (q.locked || (CONFIG.sequentialUnlock && i > 0 && !isDone(QUIZZES[i-1]))) return "locked";
  return "open";
}
function stats(){
  const done = QUIZZES.filter(isDone), n = QUIZZES.length;
  const avg = done.length ? Math.round(done.reduce((a,q)=>a+DB.progress[q.id].best,0)/done.length*10) : 0;
  return { n, done: done.length, avg, pct: n ? Math.round(done.length/n*100) : 0 };
}

/* Mistake tracking, mock history, timer helpers */
if (!DB.mistakes || typeof DB.mistakes !== "object") { DB.mistakes = {};
  QUIZZES.forEach(q => { const p = DB.progress[q.id]; if (p && p.answers) q.questions.forEach(x => { if (p.answers[x.id] !== x.correctAnswer) DB.mistakes[q.id+":"+x.id] = 1; }); }); save(); }
DB.mocks = Array.isArray(DB.mocks) ? DB.mocks : [];
const fmt = s => Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
function fromKey(k){ const [qid,n] = k.split(":"), z = QUIZZES.find(q => q.id === qid), x = z && z.questions.find(y => String(y.id) === n); return x && Object.assign({}, x, { src:k, from:z.title }); }
const shuf = a => a.map(v => [Math.random(), v]).sort((x,y) => x[0]-y[0]).map(z => z[1]);
function pickMock(){ const pools = shuf(QUIZZES).map(z => shuf(z.questions.map(x => z.id+":"+x.id))), keys = [], N = CONFIG.mock.questions;
  while (keys.length < N && pools.some(p => p.length)) pools.forEach(p => { if (p.length && keys.length < N) keys.push(p.pop()); });
  return shuf(keys); }
function startV(kind, keys, resume){
  const qs = keys.map(fromKey).filter(Boolean).map((x,i) => Object.assign(x, { id:i+1 })); if (!qs.length) return;
  const vq = { id:kind, virtual:kind, title: kind==="mock" ? "Mock Exam" : "Practice: Past Mistakes", questions:qs };
  go("quiz", { quiz:kind, vq, idx: resume ? Math.min(resume.idx||0, qs.length-1) : 0, answers: resume && resume.answers || {}, t0:Date.now(), deadline: kind==="mock" ? (resume ? resume.deadline : Date.now()+CONFIG.mock.minutes*60000) : 0 });
  if (kind==="mock") persistDraft(); }

/* View state */
let V = { view:"dash", quiz:null, idx:0, answers:{}, filter:"all", vq:null, t0:0, deadline:0, secs:0 };
function go(view, extra){ V = Object.assign({}, V, { view }, extra||{}); render(); window.scrollTo(0,0); }

function openQuiz(id){
  const q = getQuiz(id); if (!q) return;
  const d = DB.drafts[id], n = q.questions.length;
  const idx = d ? Math.min(Math.max(parseInt(d.idx,10)||0,0),n-1) : 0;
  go("quiz", { quiz:id, vq:null, deadline:0, idx, t0: Date.now() - (d && +d.el > 0 ? +d.el : 0), answers: d && d.answers && typeof d.answers==="object" ? d.answers : {} });
}
function persistDraft(){
  if (V.vq) { if (V.vq.virtual==="mock") { DB.mockDraft = { keys:V.vq.questions.map(x => x.src), idx:V.idx, answers:V.answers, deadline:V.deadline }; save(); } return; }
  DB.drafts[V.quiz] = { idx:V.idx, answers:V.answers, el:Date.now()-V.t0 }; save();
}
function submit(force){
  const q = getQuiz(V.quiz), n = Object.keys(V.answers).length;
  if (!force && n < q.questions.length && !confirm(`You have ${q.questions.length - n} unanswered question(s). Submit anyway?`)) return;
  const score = q.questions.filter(x => V.answers[x.id] === x.correctAnswer).length, secs = Math.max(0, Math.round((Date.now()-V.t0)/1000));
  q.questions.forEach(x => { const k = q.virtual ? x.src : q.id+":"+x.id; if (V.answers[x.id] === x.correctAnswer) delete DB.mistakes[k]; else DB.mistakes[k] = 1; });
  if (q.virtual) { if (q.virtual==="mock") { DB.mocks.push({ d:Date.now(), s:score, n:q.questions.length, secs }); DB.mocks = DB.mocks.slice(-20); delete DB.mockDraft; } }
  else { const old = DB.progress[q.id];
    DB.progress[q.id] = { latest:score, best: old ? Math.max(old.best, score) : score, attempts:(old?old.attempts:0)+1, answers:V.answers, secs, date:Date.now() };
    delete DB.drafts[q.id]; }
  save(); go("result", { filter:"all", secs });
}
function nextQuizOf(id){
  const i = QUIZZES.findIndex(q => q.id === id);
  return QUIZZES.slice(i+1).find((q,k) => status(q, i+1+k) !== "locked");
}
function continueLearning(){
  const d = QUIZZES.find(q => DB.drafts[q.id]);
  if (d) return openQuiz(d.id);
  const o = QUIZZES.find((q,i) => !isDone(q) && status(q,i) === "open");
  o ? openQuiz(o.id) : go("lib");
}

/* ---------- Views ---------- */

}

function vQuiz(){

function vResult(){

function tick(){
  const el = $("#tm"); if (!el || V.view !== "quiz") return;
  if (V.deadline) { const r = Math.max(0, Math.ceil((V.deadline-Date.now())/1000)); el.textContent = fmt(r); el.classList.toggle("low", r <= 300); if (r <= 0) submit(true); }
  else el.textContent = fmt(Math.max(0, Math.floor((Date.now()-V.t0)/1000)));
}
setInterval(tick, 1000);
function render(){
  $("#logo").innerHTML = icon("logo").replace('class="i"','class="i" style="width:20px;height:20px;color:#04122e"');
  $("#n-dash").innerHTML = icon("home") + "<span>Dashboard</span>";
  $("#n-lib").innerHTML = icon("grid") + "<span>Library</span>";
  $("#n-mock").innerHTML = icon("clock") + "<span>Mock</span>"; $("#n-mis").innerHTML = icon("flag") + "<span>Review</span>";
  $("#n-mock").className = V.view==="mock" ? "on" : ""; $("#n-mis").className = V.view==="mistakes" ? "on" : "";
  $("#n-dash").className = V.view==="dash" ? "on" : ""; $("#n-lib").className = V.view==="lib" ? "on" : "";
  app.innerHTML = ({ dash:vDash, lib:vLib, quiz:vQuiz, result:vResult, mock:vMock, mistakes:vMis })[V.view]();
  tick();
}

/* Events (delegated) */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const d = b.dataset, a = d.act, q = V.quiz && getQuiz(V.quiz);
  if (a==="go") go(d.v);
  else if (a==="continue") continueLearning();
  else if (a==="open") openQuiz(d.id);
  else if (a==="pick") { V.answers[q.questions[V.idx].id] = d.k; persistDraft(); render(); }
  else if (a==="prev") { V.idx--; persistDraft(); render(); window.scrollTo(0,0); }
  else if (a==="next") { V.idx++; persistDraft(); render(); window.scrollTo(0,0); }
  else if (a==="jump") { V.idx = +d.i; persistDraft(); render(); }
  else if (a==="submit") submit();
  else if (a==="startmock") startV("mock", pickMock());
  else if (a==="resume") startV("mock", DB.mockDraft.keys, DB.mockDraft);
  else if (a==="practice") startV("practice", shuf(Object.keys(DB.mistakes)).slice(0,10));
  else if (V.vq && a==="retake") { V.vq.virtual==="mock" ? startV("mock", pickMock()) : startV("practice", shuf(Object.keys(DB.mistakes)).slice(0,10)); }
  else if (a==="retake") { delete DB.drafts[V.quiz]; save(); go("quiz", { idx:0, answers:{}, t0:Date.now() }); }
  else if (a==="filter") { V.filter = V.filter==="all" ? "wrong" : "all"; render(); }
});
render();
</script>
</body>
</html>
