n about θ.", "Correct. The likelihood depends on the data only through max Xᵢ.", "Incorrect. The minimum does not capture the upper limit θ.", "Incorrect. ΣXᵢ² does not determine max Xᵢ."], ["Incorrect. X̄ alone cannot recover σ².", "Correct. The likelihood depends on the data through ΣXᵢ and ΣXᵢ².", "Incorrect. ΣXᵢ² alone loses information about μ.", "Incorrect. (X₁, Xₙ) ignores the other observations."], ["Correct. E(T*) = E(T) = θ and Var(T*) ≤ 9 by Rao–Blackwell.", "Incorrect. Conditioning never increases variance.", "Incorrect. Conditioning preserves unbiasedness.", "Incorrect. Var(T*) is zero only in degenerate cases."], ["Correct. E(X₁ | ΣXᵢ = t) = t/n = X̄.", "Incorrect. X₁ itself is not improved.", "Incorrect. ΣXᵢ has mean nλ, so it is biased.", "Incorrect. 0 is biased for λ."], ["Correct. The likelihood depends on the data only through max|Xᵢ|.", "Incorrect. X̄ does not determine the support bound.", "Incorrect. max Xᵢ ignores large negative values.", "Incorrect. ΣXᵢ² does not determine max|Xᵢ|."], ["Correct. The likelihood depends on the data through (ΣXᵢ, Σln Xᵢ).", "Incorrect. One dimension cannot carry both parameters.", "Incorrect. X̄ alone cannot give Σln Xᵢ.", "Incorrect. (X₁, Xₙ) ignores the other observations."], ["Correct. X̄ = ΣXᵢ/n is a one-to-one function of ΣXᵢ.", "Incorrect. X₁ + X₂ uses only two observations.", "Incorrect. The maximum is not a function of ΣXᵢ.", "Incorrect. The median is not a function of ΣXᵢ."], ["Correct. s/n = 2/5 = 0.4.", "Incorrect. 0.5 ignores the total.", "Incorrect. 2 is not a probability.", "Incorrect. 0.2 is 1/5 and ignores ΣXᵢ = 2."], ["Correct. Keeping more information preserves sufficiency.", "Incorrect. Extra information does not destroy sufficiency.", "Incorrect. No independence condition is needed.", "Incorrect. Unbiasedness is irrelevant to sufficiency."], ["Correct. An unbiased function of a complete sufficient statistic is the UMVUE.", "Incorrect. It is more than merely consistent.", "Incorrect. X̄ is unb function startV(kind, keys, resume){
  const qs = keys.map(fromKey).filter(Boolean).map((x,i) => Object.assign(x, { id:i+1 })); if (!qs.length) return;
  const vq = { id:kind, virtual:kind, title: kind==="mock" ? "Mock Exam" : "Practice: Past Mistakes", questions:qs };
  go("quiz", { quiz:kind, vq, timeUp:false, lay: (resume && okLay(qs, resume.lay)) ? resume.lay : mkLay(qs, false), idx: resume ? Math.min(resume.idx||0, qs.length-1) : 0, answers: resume && resume.answers || {}, t0:Date.now(), deadline: kind==="mock" ? (resume ? resume.deadline : Date.now()+CONFIG.mock.minutes*60000) : 0 });
  if (kind==="mock") persistDraft(); }

/* View state */
let V = { view:"dash", quiz:null, idx:0, answers:{}, filter:"all", vq:null, t0:0, deadline:0, secs:0 };
function go(view, extra){ V = Object.assign({}, V, { view }, extra||{}); render(); window.scrollTo(0,0); }

function openQuiz(id){
  const q = getQuiz(id); if (!q) return;
  const d = DB.drafts[id], n = q.questions.length;
  const idx = d ? Math.min(Math.max(parseInt(d.idx,10)||0,0),n-1) : 0;
  const lim = CONFIG.quizMinutes*60000, el = d && +d.el > 0 && +d.el < lim ? +d.el : 0, t0 = Date.now() - el;
  go("quiz", { quiz:id, vq:null, timeUp:false, lay: okLay(q.questions, d && d.lay) ? d.lay : (d && d.answers && Object.keys(d.answers).length ? null : mkLay(q.questions, true)), deadline:t0+lim, idx, t0, answers: d && d.answers && typeof d.answers==="object" ? d.answers : {} });
}
function persistDraft(){
  if (V.vq) { if (V.vq.virtual==="mock") { DB.mockDraft = { keys:V.vq.questions.map(x => x.src), idx:V.idx, answers:V.answers, deadline:V.deadline, lay:V.lay }; save(); } return; }
  DB.drafts[V.quiz] = { idx:V.idx, answers:V.answers, el:Date.now()-V.t0, lay:V.lay }; save();
}
function submit(force, auto){
  const q = getQuiz(V.quiz), n = Object.keys(V.answers).length;
  if (!force && n < q.questions.length && !confirm(`You have ${q.questions.length - n} unanswered question(s). Submit anyway?`)) return;
  const score = q.questions.filter(x => V.answers[x.id] === x.correctAnswer).length, secs = Math.max(0, Math.round((Date.now()-V.t0)/1000));
  q.questions.forEach(x => { const k = q.virtual ? x.src : q.id+":"+x.id; if (V.answers[x.id] === x.correctAnswer) delete DB.mistakes[k]; else DB.mistakes[k] = 1; });
  if (q.virtual) { if (q.virtual==="mock") { DB.mocks.push({ d:Date.now(), s:score, n:q.questions.length, secs }); DB.mocks = DB.mocks.slice(-20); delete DB.mockDraft; } }
  else { const old = DB.progress[q.id], n = q.questions.length, obn = old ? (old.bn || old.n || n) : n;
    const keepOld = old && old.best / obn > score / n;
    DB.progress[q.id] = { latest:score, n, best: keepOld ? old.best : score, bn: keepOld ? obn : n, attempts:(old?old.attempts:0)+1, answers:V.answers, lay:V.lay, secs, date:Date.now() };
    delete DB.drafts[q.id]; }
  save(); go("result", { filter:"all", secs, timeUp:!!auto });
}
function nextQuizOf(id){
  const i = QUIZZES.findIndex(q => q.id === id);
  return QUIZZES.slice(i+1).find((q,k) => status(q, i+1+k) !== "locked");
}
function continueLearning(){
  const d = QUIZZES.find(q => DB.drafts[q.id]);
  if (d) return openQuiz(d.id);
  const o = QUIZZES.find((q,i) => !isDone(q) && status(q,i) === "open");
  o ? openQuiz(o.id) : go("lib");
}

/* ---------- Views ---------- */
function vDash(){
  const s = stats(), hasDraft = QUIZZES.some(q => DB.drafts[q.id]);
  return `<section class="card hero"><span class="tag">COURSE</span><h1>Welcome back to STATMASTER</h1>
    <p>${esc(CONFIG.course)} — practise exam-style questions, get instant feedback and track your progress.</p>
    <button class="btn" data-act="continue">${icon("play")} ${hasDraft ? "Continue learning" : s.done ? "Next quiz" : "Start learning"}</button></section>
  <div class="grid stats" style="margin-top:14px">
    <div class="card stat"><b>${s.n}</b><span>Total quizzes</span></div>
    <div class="card stat"><b>${s.done}</b><span>Completed</span></div>
    <div class="card stat"><b>${s.avg}%</b><span>Average score</span></div>
    <div class="card stat"><b>${s.pct}%</b><span>Overall progress</span></div></div>
  <div class="grid two" style="margin-top:12px">
    <button class="card qcard" data-act="go" data-v="mock"><b>${icon("clock")} Mock exam</b><span class="mut sm">${CONFIG.mock.questions} mixed questions · ${CONFIG.mock.minutes} min</span></button>
    <button class="card qcard" data-act="go" data-v="mistakes"><b>${icon("flag")} Mistakes review</b><span class="mut sm">${Object.keys(DB.mistakes).length} question(s) to revisit</span></button></div>
  <div class="card" style="margin-top:12px"><div class="row sm"><b>${esc(CONFIG.course)}</b><span class="mut">${s.done}/${s.n} quizzes</span></div>
    <div class="prog" style="margin-top:10px"><i style="width:${s.pct}%"></i></div></div>`;
}
function vLib(){
  return `<h1>Quiz Library</h1><p class="mut">${esc(CONFIG.course)}</p><div class="grid lib" style="margin-top:14px">` +
  QUIZZES.map((q,i) => {
    const st = status(q,i), p = DB.progress[q.id];
    const badge = st==="done" ? `<span class="badge b-ok">Completed</span>` : st==="locked" ? `<span class="badge b-lk">Locked</span>` : `<span class="badge b-av">Available</span>`;
    return `<button class="card qcard ${st==="locked"?"lock":""}" ${st==="locked"?"disabled":""} data-act="open" data-id="${q.id}">
      <div class="row"><span class="mut sm">Quiz ${i+1}</span>${badge}</div>
      <b style="font-size:1.1rem">${esc(q.title)}</b><span class="mut sm">${esc(q.description)}</span>
      <div class="row sm"><span>${q.questions.length} questions · ${CONFIG.quizMinutes} min</span><span>${p ? `${icon("star")} Best ${bestLabel(q,p)}` : st==="locked" ? icon("lock") : "Not attempted"}</span></div>
      ${DB.drafts[q.id] ? `<span class="sm" style="color:var(--warn)">In progress</span>` : ""}${isOld(q,p) ? `<span class="sm" style="color:var(--warn)">Old attempt (out of ${p.bn||p.n}) – retake for a /${q.questions.length} score</span>` : ""}</button>`;
  }).join("") + `</div>`;
}
function vQuiz(){
  const q = getQuiz(V.quiz), S = seq(q, V.lay), Q = S[V.idx], n = S.length, a = Object.keys(V.answers).length;
  return `<div class="row"><b>${esc(q.title)}</b><span class="tm" id="tm"></span></div><div id="warn" class="warn" role="alert" hidden>⏰ 1 minute left – finish your answers, then submit.</div><div class="mut sm">Question ${V.idx+1} of ${n}</div>
  <div class="prog" style="margin:10px 0"><i style="width:${a/n*100}%"></i></div>
  <div class="row sm mut"><span>Answered: <b style="color:var(--cyan)">${a}</b></span><span>Unanswered: <b>${n-a}</b></span></div>
  <div class="chips">${S.map((x,i)=>`<button class="chip ${V.answers[x.id]?"done":""} ${i===V.idx?"cur":""}" data-act="jump" data-i="${i}">${i+1}</button>`).join("")}</div>
  <div class="card"><div class="mut sm">Question ${V.idx+1}</div><div class="qtext">${M(Q.question)}</div>
  ${Q.perm.split("").map((k,i)=>`<button class="opt ${V.answers[Q.id]===k?"sel":""}" data-act="pick" data-k="${k}"><span class="k">${LET[i]}</span><span>${M(Q.options[k])}</span></button>`).join("")}</div>
  <div class="nav"><button class="btn ghost" data-act="prev" ${V.idx===0?"disabled":""}>${icon("left")} Previous</button>
  ${V.idx<n-1 ? `<button class="btn ghost" data-act="next">Next ${icon("right")}</button>` : ""}</div>
  <div style="margin-top:12px"><button class="btn" style="width:100%" data-act="submit">${icon("send")} Submit Answers</button></div>`;
}
function vResult(){
  const q = getQuiz(V.quiz), p = q.virtual ? { answers:V.answers } : DB.progress[q.id], ans = p.answers || {}, n = q.questions.length, S = seq(q, q.virtual ? V.lay : p.lay);
  const score = S.filter(x => ans[x.id] === x.correctAnswer).length, pct = Math.round(score/n*100);
  const wrong = n - score, nx = q.virtual ? null : nextQuizOf(q.id);
  const list = S.map((x,i) => ({x,i})).filter(o => V.filter==="all" || ans[o.x.id] !== o.x.correctAnswer);
  return `${V.timeUp ? `<div class="timeup" role="alert"><b>⏰ Time's up!</b> The timer reached 0:00 and your answers were submitted automatically. Unanswered questions are marked in the review below.</div>` : ""}<div class="card score"><div class="mut sm">${esc(q.title)}</div><div class="big">${score}/${n}</div>
    <b>${pct}%</b><div class="prog" style="margin:12px 0"><i style="width:${pct}%"></i></div>
    <div class="row sm"><span style="color:var(--ok)">${icon("check")} ${score} correct</span><span style="color:var(--bad)">${icon("x")} ${wrong} incorrect</span><span class="mut">${q.virtual ? "Time "+fmt(V.secs||0) : "Best "+bestLabel(q,p)+(p.secs ? " · "+fmt(p.secs) : "")}</span></div>
    <div class="actions"><button class="btn ghost" data-act="retake">${icon("redo")} Retake Quiz</button>
    ${nx ? `<button class="btn" data-act="open" data-id="${nx.id}">Next Quiz ${icon("right")}</button>` : `<button class="btn" data-act="go" data-v="lib">Quiz Library</button>`}</div></div>
  <div class="row" style="margin-top:22px"><h2 style="margin:0">Review</h2>
    <button class="btn ghost" style="padding:8px 14px;min-height:38px" data-act="filter">${V.filter==="all"?"Show mistakes only":"Show all"}</button></div>
  ${list.length ? "" : `<p class="card mut" style="margin-top:12px">No mistakes to review. Excellent work!</p>`}
  ${list.map(({x,i}) => { const u = ans[x.id], ok = u === x.correctAnswer;
    return `<div class="card rev ${ok?"ok":"bad"}"><div class="row sm"><b>Question ${i+1}${x.from ? " · "+esc(x.from) : ""}</b><span style="color:var(--${ok?"ok":"bad"})">${ok?"Correct":u?"Incorrect":"Unanswered"}</span></div>
    <div class="qtext">${M(x.question)}</div>
    ${x.perm.split("").map((k,j)=>`<div class="opt ${k===x.correctAnswer?"right":k===u?"wrong":""}"><span class="k">${LET[j]}</span><span>${M(x.options[k])}${k===u?` <i class="sm mut">(your answer)</i>`:""}${k===x.correctAnswer?` <i class="sm" style="color:var(--ok)">(correct)</i>`:""}
      ${x.optionExplanations?`<p class="oe">${M(x.optionExplanations[k]||"")}</p>`:""}</span></div>`).join("")}
    <div class="expl"><b>Correct answer: ${LET[x.perm.indexOf(x.correctAnswer)]}.</b> ${M(x.explanation)}</div></div>`; }).join("")}`;
}

function vMock(){
  const m = CONFIG.mock, dr = DB.mockDraft && DB.mockDraft.keys && DB.mockDraft.keys.length;
  const hist = DB.mocks.slice(-5).reverse().map(h => `<div class="row sm" style="margin-top:8px"><span class="mut">${new Date(h.d).toLocaleDateString()}</span><b>${h.s}/${h.n} (${Math.round(h.s/h.n*100)}%)</b><span class="mut">${fmt(h.secs)}</span></div>`).join("");
  return `<h1>Mock Exam</h1><p class="mut">${m.questions} random questions drawn from all ${QUIZZES.length} quizzes, ${m.minutes} minutes. A fresh random set every time. Answers and explanations appear after you submit; the exam submits itself when time runs out.</p>
  <div class="actions"><button class="btn" data-act="startmock">${icon("play")} Start new mock exam</button>${dr ? `<button class="btn ghost" data-act="resume">Resume unfinished exam</button>` : ""}</div>
  <h2>Recent attempts</h2>${hist ? `<div class="card">${hist}</div>` : `<p class="card mut">No mock exams taken yet.</p>`}`;
}
function vMis(){
  const items = Object.keys(DB.mistakes).map(fromKey).filter(Boolean).sort((a,b) => a.src.localeCompare(b.src, undefined, {numeric:true}));
  if (!items.length) return `<h1>Mistakes Review</h1><p class="card mut" style="margin-top:12px">Nothing to review. Questions you answer wrongly in any quiz or mock exam will collect here, and leave once you answer them correctly.</p>`;
  return `<h1>Mistakes Review</h1><p class="mut">${items.length} question(s) you last answered incorrectly or skipped.</p>
  <div class="actions"><button class="btn" data-act="practice">${icon("redo")} Practise ${Math.min(10, items.length)} of these</button></div>
  ${items.map(x => `<div class="card rev bad"><div class="row sm"><b>${esc(x.from)}</b><span class="mut">Question ${esc(x.src.split(":")[1])}</span></div><div class="qtext">${M(x.question)}</div>
    ${Object.keys(x.options).map(k => `<div class="opt ${k===x.correctAnswer?"right":""}"><span class="k">${k}</span><span>${M(x.options[k])}${k===x.correctAnswer ? ` <i class="sm" style="color:var(--ok)">(correct)</i>` : ""}</span></div>`).join("")}
    <div class="expl"><b>Correct answer: ${x.correctAnswer}.</b> ${M(x.explanation)}</div></div>`).join("")}`;
}
function tick(){
  const el = $("#tm"); if (!el || V.view !== "quiz") return;
  if (V.deadline) { const r = Math.max(0, Math.ceil((V.deadline-Date.now())/1000)); el.textContent = fmt(r); el.classList.toggle("low", r <= 60); const w = $("#warn"); if (w) w.hidden = !(r > 0 && r <= 60); if (r <= 0) submit(true, true); }
  else el.textContent = fmt(Math.max(0, Math.floor((Date.now()-V.t0)/1000)));
}
setInterval(tick, 1000);
function render(){
  $("#logo").innerHTML = icon("logo").replace('class="i"','class="i" style="width:20px;height:20px;color:#04122e"');
  $("#n-dash").innerHTML = icon("home") + "<span>Dashboard</span>";
  $("#n-lib").innerHTML = icon("grid") + "<span>Library</span>";
  $("#n-mock").innerHTML = icon("clock") + "<span>Mock</span>"; $("#n-mis").innerHTML = icon("flag") + "<span>Review</span>";
  $("#n-mock").className = V.view==="mock" ? "on" : ""; $("#n-mis").className = V.view==="mistakes" ? "on" : "";
  $("#n-dash").className = V.view==="dash" ? "on" : ""; $("#n-lib").className = V.view==="lib" ? "on" : "";
  app.innerHTML = ({ dash:vDash, lib:vLib, quiz:vQuiz, result:vResult, mock:vMock, mistakes:vMis })[V.view]();
  tick();
}

/* Events (delegated) */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const d = b.dataset, a = d.act, q = V.quiz && getQuiz(V.quiz);
  if (a==="go") go(d.v);
  else if (a==="continue") continueLearning();
  else if (a==="open") openQuiz(d.id);
  else if (a==="pick") { V.answers[seq(q, V.lay)[V.idx].id] = d.k; persistDraft(); render(); }
  else if (a==="prev") { V.idx--; persistDraft(); render(); window.scrollTo(0,0); }
  else if (a==="next") { V.idx++; persistDraft(); render(); window.scrollTo(0,0); }
  else if (a==="jump") { V.idx = +d.i; persistDraft(); render(); }
  else if (a==="submit") submit();
  else if (a==="startmock") startV("mock", pickMock());
  else if (a==="resume") { if (DB.mockDraft && DB.mockDraft.keys) startV("mock", DB.mockDraft.keys, DB.mockDraft); }
  else if (a==="practice") startV("practice", shuf(Object.keys(DB.mistakes)).slice(0,10));
  else if (V.vq && a==="retake") { V.vq.virtual==="mock" ? startV("mock", pickMock()) : startV("practice", shuf(Object.keys(DB.mistakes)).slice(0,10)); }
  else if (a==="retake") { delete DB.drafts[V.quiz]; save(); go("quiz", { idx:0, answers:{}, timeUp:false, lay:mkLay(q.questions, true), t0:Date.now(), deadline:Date.now()+CONFIG.quizMinutes*60000 }); }
  else if (a==="filter") { V.filter = V.filter==="all" ? "wrong" : "all"; render(); }
});
render();
</script>
</body>
</html>
